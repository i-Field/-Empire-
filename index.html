<head>

<style>
/* ═══════════════ БАЗОВЫЕ СТИЛИ ═══════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#1a3a0a;max-width:430px;margin:0 auto;}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ═══════════════ ТОПБАР ═══════════════ */
.topbar{background:rgba(8,5,0,.98);border-bottom:1px solid rgba(100,80,20,.4);padding:6px 10px 7px;flex-shrink:0;padding-top:max(6px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));}
.tb1{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}

.tb-right{display:flex;align-items:center;gap:6px;}
.music-btn,.lang-btn{background:rgba(20,50,0,.9);border:1.5px solid rgba(100,180,20,.5);border-radius:20px;padding:3px 9px;font-size:13px;font-weight:bold;cursor:pointer;color:#a0d040;display:flex;align-items:center;justify-content:center;min-width:32px;height:26px;}

.pano-header{display:flex;align-items:center;justify-content:space-between;padding:5px 2px 4px;}

/* ═══════════════ НИЖНЯЯ ПАНЕЛЬ ═══════════════ */

@keyframes spulse{0%,100%{box-shadow:0 0 20px rgba(240,180,30,.5);}50%{box-shadow:0 0 36px rgba(240,180,30,.9);}}

.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(calc(100% - 52px));bottom:64px;width:100%;max-width:430px;background:rgba(6,3,0,.99);border-top:2.5px solid rgba(160,120,30,.7);border-radius:16px 16px 0 0;display:flex;flex-direction:column;max-height:75vh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.6);padding-bottom:0;}

/* ═══════════════ КАРТОЧКИ БУДИВЕЛЬ ═══════════════ */

/* ═══════════════ ИНФО ПАНЕЛЬ ═══════════════ */
.ibox{background:rgba(255,255,255,.05);border:1.5px solid rgba(200,160,50,.25);border-radius:9px;padding:10px;}

.ibtn-d{background:rgba(80,10,10,.3);border-color:#8a2020;color:#d06060;}

/* ═══════════════ СТАТИСТИКА ═══════════════ */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.sbox{background:rgba(255,255,255,.05);border:1.5px solid rgba(200,160,50,.2);border-radius:9px;padding:8px 10px;}
.sbl{font-size:9px;color:rgba(200,160,50,.5);text-transform:uppercase;letter-spacing:1px;font-family:'Russo One',sans-serif;}
.sbv{font-family:'Russo One',sans-serif;font-size:20px;color:#80c030;margin-top:2px;}
.sbv.g{color:#e0a020;}

/* ═══════════════ УВЕДОМЛЕНИЯ ═══════════════ */
.notif{position:fixed;top:14px;left:50%;z-index:9999;transform:translateX(-50%) translateY(-80px);background:rgba(10,5,0,.98);border:2px solid #e0a020;border-radius:10px;padding:9px 18px;font-size:12px;font-weight:700;color:#d8b850;font-family:'Russo One',sans-serif;transition:transform .3s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.8);}
.notif.show{transform:translateX(-50%) translateY(0);}

<body>
<div class="app">
  <!-- ПАНОРАМА -->
  <div class="pano-wrap" id="panoWrap">
    <div class="pano-header">
      <span class="pano-title" id="panoTitle">🌿 ХУТОР RASTAMANIA</span>
      <button class="pano-close" onclick="togglePano()" id="panoBtn">▲</button>
    </div>
    <div class="pano-canvas-wrap"><canvas id="panoCanvas" height="90"></canvas></div>
  </div>

  <!-- ТОПБАР -->
  <div class="topbar">
    <div class="tb1">
      <div class="logo">🌿 <em>Хутор</em> EMPIRE</div>
      <div class="tb-right">
        <button class="lang-btn" id="langBtn" onclick="cycleLang()">UA</button>

  <!-- БУСТ ЗА ЗВЕЗДЫ -->

    <div class="stars-info">
      <span class="stars-ico">⭐</span>
      <div><strong id="boostTitle">ЗОРЯНИЙ БУСТ</strong><span id="boostDesc">+200💰 · ×2 · 60с</span></div>
    </div>
    <button class="stars-btn" id="boostBtn" onclick="buyStars()">50 ⭐</button>

  <!-- НИЖНЕЕ МЕНЮ -->

      <div class="btab" id="tab-info" onclick="sp('info')"><span class="bi">📍</span><span id="tab-t-info">Будівля</span></div>
      <div class="btab" id="tab-chain" onclick="sp('chain')"><span class="bi">⛓️</span><span id="tab-t-chain">Ланцюг</span></div>
      <div class="btab" id="tab-stats" onclick="sp('stats')"><span class="bi">📊</span><span id="tab-t-stats">Місто</span></div>
    </div>
    <div class="bc">
      <div id="panel-build"><div class="bgrid" id="bgrid"></div></div>
      <div id="panel-info" style="display:none"><div id="icontent"></div></div>
      <div id="panel-chain" style="display:none"></div>
      <div id="panel-stats" style="display:none"><div class="sgrid" id="sgrid"></div></div>
    </div>
  </div>
</div>
<div class="notif" id="notif"></div>

<script>
'use strict';
// ═══════════════ НАСТРОЙКИ ═══════════════
const API_URL = "https://empire.qx420.workers.dev";
const COLS = 5, ROWS = 4;
const HEX_R = 44;
const HEX_W = HEX_R * Math.sqrt(3);
const DAY = 90000; // Длительность игрового дня в мс

// ═══════════════ КАНВАСЫ ═══════════════
const pano = document.getElementById('panoCanvas');
const pc = pano.getContext('2d');
const game = document.getElementById('gameCanvas');
const gc = game.getContext('2d');

// ═══════════════ МУЛЬТИЯЗЫЧНОСТЬ (i18n) ═══════════════
let currentLang = localStorage.getItem('kh_lang') || 'ua';
const TEXTS = {
  ua: {
    panoTitle: "🌿 ХУТІР RASTAMANIA", boostTitle: "ЗОРЯНИЙ БУСТ", boostDesc: "+200💰 · ×2 · 60с",
    tabs: { build: "Будувати", info: "Будівля", chain: "Ланцюг", stats: "Місто" },
    notEnough: "⚠ Не вистачає: ", built: "✅ збудовано!", upgraded: "⬆ Апгрейд!",
    demolished: "🗑 Знесено +", maxLvl: "МАКС РІВЕНЬ", saveOk: "☁️ Збережено",
    selectTile: "Обери клітинку", seasons: { spring: "🌸 Весна", summer: "🌞 Літо", autumn: "🍂 Осінь", winter: "❄️ Зима" },
    stats: { earned: "💰 Зароблено", cycles: "🔄 Циклів", built: "🏗 Будівель", pop: "👥 Населення" }
  },
  ru: {
    panoTitle: "🌿 ХУТОР RASTAMANIA", boostTitle: "ЗВЕЗДНЫЙ БУСТ", boostDesc: "+200💰 · ×2 · 60с",
    tabs: { build: "Строить", info: "Здание", chain: "Цепочка", stats: "Город" },
    notEnough: "⚠ Не хватает: ", built: "✅ построено!", upgraded: "⬆ Апгрейд!",
    demolished: "🗑 Снесено +", maxLvl: "МАКС УРОВЕНЬ", saveOk: "☁️ Сохранено",
    selectTile: "Выбери клетку", seasons: { spring: "🌸 Весна", summer: "🌞 Лето", autumn: "🍂 Осень", winter: "❄️ Зима" },
    stats: { earned: "💰 Заработано", cycles: "🔄 Циклов", built: "🏗 Зданий", pop: "👥 Население" }
  },
  en: {
    panoTitle: "🌿 RASTAMANIA FARM", boostTitle: "STAR BOOST", boostDesc: "+200💰 · ×2 · 60s",
    tabs: { build: "Build", info: "Building", chain: "Chain", stats: "City" },
    notEnough: "⚠ Not enough: ", built: "✅ built!", upgraded: "⬆ Upgraded!",
    demolished: "🗑 Demolished +", maxLvl: "MAX LEVEL", saveOk: "☁️ Saved",
    selectTile: "Select a tile", seasons: { spring: "🌸 Spring", summer: "🌞 Summer", autumn: "🍂 Autumn", winter: "❄️ Winter" },
    stats: { earned: "💰 Earned", cycles: "🔄 Cycles", built: "🏗 Buildings", pop: "👥 Population" }
  }
};
const L = TEXTS[currentLang];

function cycleLang() {
  const langs = ['ua', 'ru', 'en'];
  let idx = langs.indexOf(currentLang);
  currentLang = langs[(idx + 1) % langs.length];
  localStorage.setItem('kh_lang', currentLang);
  updateUI();
  renderBuild(); // Перерисовываем карточки с новыми названиями
  renderRes();
  notify(currentLang === 'ua' ? "Мову змінено 🇺🇦" : currentLang === 'ru' ? "Язык изменен 🇷🇺" : "Language changed 🇬🇧");
}

function updateUI() {
  const l = TEXTS[currentLang];
  document.getElementById('langBtn').textContent = currentLang.toUpperCase();
  document.getElementById('panoTitle').textContent = l.panoTitle;
  document.getElementById('boostTitle').textContent = l.boostTitle;
  document.getElementById('boostDesc').textContent = l.boostDesc;
  document.getElementById('tab-t-build').textContent = l.tabs.build;
  document.getElementById('tab-t-info').textContent = l.tabs.info;
  document.getElementById('tab-t-chain').textContent = l.tabs.chain;
  document.getElementById('tab-t-stats').textContent = l.tabs.stats;
  document.getElementById('icontent').innerHTML = `<p style="text-align:center;color:rgba(200,160,50,.35);padding:18px 0;font-style:italic">${l.selectTile}</p>`;
}

// ═══════════════ ЗВУКОВОЙ ДВИЖОК (WebAudio) ═══════════════
let actx = null, mGain = null, musicOn = true, musicPlaying = false, mTimer = null, audioReady = false;

function getA() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (!mGain) { mGain = actx.createGain(); mGain.gain.value = 0.15; mGain.connect(actx.destination); }
  return actx;
}
function unlockAudio() {
  if (audioReady) return; audioReady = true;
  try { getA().resume(); if (musicOn) startMusic(); } catch (e) {}
}
function mkNoise(dur) {
  const a = getA(), buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return buf;
}
function pOsc(f, t, type, dur, vol, dest) {
  try {
    const a = getA(), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(dest || mGain);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.1, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function pNoise(t, dur, freq, Q, vol) {
  try {
    const a = getA(), s = a.createBufferSource(); s.buffer = mkNoise(dur);
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = Q || 1;
    const g = a.createGain(); s.connect(f); f.connect(g); g.connect(mGain);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.08, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.start(t); s.stop(t + dur);
  } catch (e) {}
}

// Фоновая музыка
const BPM = 70, BD = 60 / BPM;
const CH = { Cm: [130.8, 155.6, 196], Fm: [174.6, 207.7, 261.6], Bb: [116.5, 146.8, 174.6], Gm: [98, 116.5, 146.8] };
const CS = ['Cm', 'Cm', 'Fm', 'Fm', 'Bb', 'Gm', 'Cm', 'Cm'];
const BN = { Cm: 65.4, Fm: 87.3, Bb: 58.3, Gm: 49 };

function schedBar(t, bar) {
  if (!musicPlaying) return;
  const ch = CH[CS[bar % 8]], bn = BN[CS[bar % 8]];
  ch.forEach(f => { pOsc(f, t, 'triangle', BD * 3.8, 0.04); pOsc(f * 2, t + BD * 0.1, 'sine', BD * 3.2, 0.01); });
  [0, 2, 3.5].forEach(o => pOsc(bn, t + BD * o, 'sine', BD * 0.35, 0.15));
  [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5].forEach(o => pNoise(t + BD * o, 0.07, 8000, 0.8, o % 1 === 0 ? 0.03 : 0.01));
  [0, 2].forEach(o => { pNoise(t + BD * o, 0.14, 80, 0.5, 0.1); pOsc(55, t + BD * o, 'sine', 0.12, 0.1); });
  if (bar % 2 === 0) {
    const n = [130.8, 155.6, 196, 261.6, 293.7][Math.floor(Math.random() * 5)];
    pOsc(n * 2, t + BD * (1 + Math.random() * 2), 'sine', BD * 0.4, 0.04);
  }
  mTimer = setTimeout(() => schedBar(t + BD * 4, bar + 1), (BD * 4 - 0.1) * 1000);
}
function startMusic() { if (musicPlaying || !actx) return; musicPlaying = true; schedBar(actx.currentTime + 0.1, 0); }
function stopMusic() { musicPlaying = false; clearTimeout(mTimer); }
function toggleMusic() {
  unlockAudio(); musicOn = !musicOn;
  if (musicOn) startMusic(); else stopMusic();
  document.getElementById('musicBtn').textContent = musicOn ? '🎵' : '🔇';
}

// Звуки окружения и зданий
function sBird() {
  try {
    const a = getA(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.connect(g); g.connect(mGain);
    o.frequency.setValueAtTime(2200, t); o.frequency.setValueAtTime(2800, t + 0.06); o.frequency.setValueAtTime(2100, t + 0.12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.08, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.start(t); o.stop(t + 0.18);
  } catch (e) {}
}
function sBees() {
  try {
    const a = getA(), t = a.currentTime, c = a.createOscillator(), m = a.createOscillator(), mg = a.createGain(), g = a.createGain();
    c.type = 'sawtooth'; c.frequency.value = 180; m.type = 'sine'; m.frequency.value = 140; mg.gain.value = 60;
    m.connect(mg); mg.connect(c.frequency); c.connect(g); g.connect(mGain);

function hexCenter(col, row) {
  const offX = (game.width - (COLS * HEX_W + HEX_W * 0.5)) / 2;
  const offY = HEX_R;
  const x = offX + col * HEX_W + (row % 2 === 1 ? HEX_W / 2 : 0) + HEX_W / 2;
  const y = offY + row * HEX_R * 1.5 + HEX_R;
  return { x, y };
}
function hexPath(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    const x = cx + r * Math.cos(a); const y = cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function pixelToHex(px, py) {
  let best = -1, bestDist = HEX_R * 1.1;
  for (let i = 0; i < COLS * ROWS; i++) {
    const col = i % COLS, row = Math.floor(i / COLS);
    const { x, y } = hexCenter(col, row);
    const d = Math.sqrt((px - x) ** 2 + (py - y) ** 2);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

  [[.25,.18],[.75,.22]].forEach(([rx,rh])=>{ ctx.fillStyle='#484030'; ctx.fillRect(cx-bw/2+bw*rx-4,gy-bh-tw*rh,8,tw*rh+4); if(smk){ const st=(f*.3+rx*10)%20; ctx.globalAlpha=Math.max(0,.45-st/20); ctx.fillStyle='rgba(180,160,140,.8)'; ctx.beginPath(); ctx.arc(cx-bw/2+bw*rx,gy-bh-tw*rh-st,2.5+st*.1,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; } });
}
function drawMill(ctx,x,y,tw,f) {
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd()); const cx=x+tw*.5,gy=y+tw*.91;
  ctx.fillStyle=season==='winter'?'#d8e4f0':'#e8e0c0'; ctx.beginPath(); ctx.moveTo(cx-tw*.19,gy-tw*.58); ctx.lineTo(cx-tw*.12,gy); ctx.lineTo(cx+tw*.12,gy); ctx.lineTo(cx+tw*.19,gy-tw*.58); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7a5830'; ctx.beginPath(); ctx.moveTo(cx-tw*.21,gy-tw*.58); ctx.lineTo(cx,gy-tw*.8); ctx.lineTo(cx+tw*.21,gy-tw*.58); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(cx,gy-tw*.62); ctx.rotate(f*.04); ctx.fillStyle='#9a7038';
  [[0],[Math.PI/2],[Math.PI],[Math.PI*1.5]].forEach(([a])=>{ ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(-2.5,0); ctx.lineTo(-4,-tw*.28); ctx.lineTo(4,-tw*.28); ctx.lineTo(2.5,0); ctx.closePath(); ctx.fill(); ctx.restore(); });
  ctx.fillStyle='#503818'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function drawSolar(ctx,x,y,tw,f) {
  gnd(ctx,x,y,tw,tw,'#181808','#2a2808'); const cx=x+tw*.5,cy=y+tw*.5;
  ctx.fillStyle='#1a3870'; ctx.fillRect(cx-tw*.38,cy-tw*.3,tw*.76,tw*.5); ctx.fillStyle='#152e60';
  for(let r=0;r<3;r++)for(let c=0;c<4;c++)ctx.fillRect(cx-tw*.36+c*tw*.18,cy-tw*.28+r*tw*.15,tw*.16,tw*.13);
  ctx.fillStyle='#585858'; ctx.fillRect(cx-2,cy+tw*.2,4,tw*.26);
}
function drawBeehive(ctx,x,y,tw,f) {
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd()); const hx=x+tw*.5,hy=y+tw*.62;
  ctx.fillStyle='#d0a038'; ctx.beginPath(); ctx.ellipse(hx,hy,tw*.26,tw*.32,0,Math.PI,0,true); ctx.fill();
  ctx.fillStyle='#a87828'; ctx.beginPath(); ctx.ellipse(hx,hy,tw*.28,tw*.06,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a1500'; ctx.beginPath(); ctx.ellipse(hx,hy+2,tw*.055,tw*.038,0,0,Math.PI*2); ctx.fill();
  [0,2.1,4.2].forEach(off=>drawBee(ctx,hx+Math.cos(beeAngle+off)*tw*.38,hy-tw*.1+Math.sin(beeAngle+off)*tw*.16,beeAngle+off,f));
}
function drawGreenhouse(ctx,x,y,tw,f) {
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd()); const cx=x+tw*.5,gy=y+tw*.9,w=tw*.72,h=tw*.48;
  ctx.fillStyle=`rgba(160,220,200,${.22+Math.sin(f*.04)*.05})`; ctx.fillRect(cx-w/2,gy-h,w,h);
  ctx.strokeStyle='rgba(100,160,120,.7)'; ctx.lineWidth=1.5; ctx.strokeRect(cx-w/2,gy-h,w,h);
}
function drawEmpty(ctx,x,y,tw,f) {
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd()); const cx2=x+tw/2,cy2=y+tw/2;
  ctx.strokeStyle=season==='winter'?'#708090':'#4a9a18'; ctx.lineWidth=1.8;
  [[.18,.62],[.45,.38],[.78,.68]].forEach(([rx,ry])=>{ const gx=x+tw*rx,gy=y+tw*ry; ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx-1,gy-7); ctx.moveTo(gx,gy); ctx.lineTo(gx+2,gy-6); ctx.stroke(); });
  const pulse=Math.sin(f*.04)*.15+.25; ctx.strokeStyle=`rgba(120,200,80,${pulse})`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx2-8,cy2); ctx.lineTo(cx2+8,cy2); ctx.moveTo(cx2,cy2-8); ctx.lineTo(cx2,cy2+8); ctx.stroke();
}
function drawDrone(ctx,d) {
  const dx=d.tx-d.x,dy=d.ty-d.y,dist=Math.sqrt(dx*dx+dy*dy); if(dist<8){ d.tx=Math.random()*game.width; d.ty=20+Math.random()*50; }
  d.x+=dx/dist*d.sp; d.y+=dy/dist*d.sp; d.led+=.12; const bob=Math.sin(frame*.09)*3,angle=Math.atan2(dy,dx);
  ctx.save(); ctx.translate(d.x,d.y+bob); ctx.rotate(angle-Math.PI/2);
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(2,4,14,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#404040'; ctx.beginPath(); ctx.ellipse(0,0,10,7,0,0,Math.PI*2); ctx.fill();
  [[-.7,-.65],[.7,-.65],[-.7,.65],[.7,.65]].forEach(([ax,ay])=>{ ctx.fillStyle='#444'; ctx.beginPath(); ctx.arc(ax*18,ay*10,4,0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}

// ═══════════════ ГЛАВНЫЙ РЕНДЕР ═══════════════
function drawTile(idx,sunX) {
  const col=idx%COLS,row=Math.floor(idx/COLS); const {x:cx,y:cy}=hexCenter(col,row);
  const r=HEX_R-1; const TW2=r*2; const x=cx-r,y=cy-r;
  gc.save(); gc.translate(0, 5); hexPath(gc,cx,cy,r); gc.fillStyle='rgba(0,0,0,0.35)'; gc.fill(); gc.restore();
  hexPath(gc,cx,cy,r); gc.fillStyle=sgnd(); gc.fill();
  gc.save(); hexPath(gc,cx,cy,r); gc.clip();
  const b=S.grid[idx];
  try {
    if(b) {
      const t=b.t;
      if(t==='hemp_farm') { gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#2a600a'); [.2,.5,.8].forEach((rx,i)=>drawHempPlant(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.48+i*.04),frame)); }
      else if(t==='sunflower') { gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#3a700a'); [.2,.52,.82].forEach((rx,i)=>drawSunflower(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.44+i*.04),frame,sunX)); }
      else if(t==='corn_field') { gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#3a700a'); [.2,.5,.8].forEach((rx,i)=>drawCorn(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.52+i*.04),frame)); }
      else if(t==='poppy') { gnd(gc,cx-r,cy-r,TW2,TW2,'#180a28','#281040'); [[.17,.58,0],[.38,.64,1],[.6,.59,2],[.82,.55,3]].forEach(([rx,ry,i])=>drawPoppy(gc,cx-r+TW2*rx,cy-r+TW2*ry,TW2*.4,frame,i)); }
      else if(t==='beehive') drawBeehive(gc,cx-r,cy-r,TW2,frame);
      else if(t==='greenhouse') drawGreenhouse(gc,cx-r,cy-r,TW2,frame);
      else if(t==='house') drawHouse(gc,cx-r,cy-r,TW2,frame);
      else if(t==='mill') drawMill(gc,cx-r,cy-r,TW2,frame);
      else if(t==='solar') drawSolar(gc,cx-r,cy-r,TW2,frame);
      else drawFactory(gc,cx-r,cy-r,TW2,frame,'#906858',true);
      
      gc.fillStyle='rgba(0,0,0,.55)'; gc.fillRect(cx-r+2,cy-r+2,20,13);
      gc.fillStyle='#f0b828'; gc.font='bold 10px Russo One'; gc.textAlign='left'; gc.textBaseline='top'; gc.fillText('Lv'+b.lv,cx-r+3,cy-r+2);
      gc.fillStyle='rgba(0,0,0,.52)'; gc.fillRect(cx-r,cy+r-14,r*2,14);
      gc.fillStyle='#b0f048'; gc.font='8px sans-serif'; gc.textAlign='center'; gc.textBaseline='bottom'; gc.fillText(B[b.t]?.cy||'',cx,cy+r-1);
    } else drawEmpty(gc,cx-r,cy-r,TW2,frame);
  } catch(e) {}
  gc.restore();
  hexPath(gc,cx,cy,r);
  if(S.sel===idx) { const pulse=Math.sin(frame*.12)*.3+.7; gc.strokeStyle=`rgba(240,180,20,${pulse})`; gc.lineWidth=3; gc.fillStyle=`rgba(240,180,20,${pulse*.1})`; gc.fill(); gc.stroke(); }
  else { gc.strokeStyle='rgba(0,0,0,.45)'; gc.lineWidth=1.5; gc.stroke(); }
}

function drawPano() {
  const W=pano.width,H=pano.height,t=gt(),night=nf();
  let st,sb;
  if(night>.7){st='#040820';sb='#080c28';} else if(t<.3||t>.7){st='#e87020';sb='#f0a848';} else if(season==='winter'){st='#b0c8e0';sb='#d8e8f0';} else if(season==='autumn'){st='#c06820';sb='#e0a040';} else{st='#3888d8';sb='#80bce8';}
  const sky=pc.createLinearGradient(0,0,0,H*.6); sky.addColorStop(0,st); sky.addColorStop(1,sb); pc.fillStyle=sky; pc.fillRect(0,0,W,H*.6);
  const g1=season==='winter'?'#d0dce8':season==='autumn'?'#c09040':'#5ab030'; const g2=season==='winter'?'#b8c8d8':season==='autumn'?'#a07028':'#3a8018';
  const gnd2=pc.createLinearGradient(0,H*.6,0,H); gnd2.addColorStop(0,g1); gnd2.addColorStop(1,g2); pc.fillStyle=gnd2; pc.fillRect(0,H*.6,W,H*.4);
  if(night>.3) stars.forEach(s=>{ const tw2=Math.sin(frame*.04+s.ph)*.4+.6; pc.fillStyle=`rgba(255,255,240,${night*tw2*.85})`; pc.beginPath(); pc.arc(s.x,s.y,s.r,0,Math.PI*2); pc.fill(); });
  const sunX=W*(.08+t*.84),sunY=H*(.22+Math.sin(t*Math.PI)*(-.18));
  if(night<.9) { const sa=1-night,sg2=pc.createRadialGradient(sunX,sunY,0,sunX,sunY,28); sg2.addColorStop(0,`rgba(255,253,220,${sa})`); sg2.addColorStop(.4,`rgba(255,210,60,${sa})`); sg2.addColorStop(1,'rgba(255,180,40,0)'); pc.fillStyle=sg2; pc.fillRect(sunX-32,sunY-32,64,64); }
  clouds.forEach(cl=>{ cl.x+=cl.sp; if(cl.x>W+110)cl.x=-110; pc.fillStyle=`rgba(255,255,255,${night>.6?.25:.75})`; pc.beginPath(); pc.ellipse(cl.x,H*.2,36,15,0,0,Math.PI*2); pc.fill(); pc.beginPath(); pc.ellipse(cl.x-19,H*.22,21,13,0,0,Math.PI*2); pc.fill(); pc.beginPath(); pc.ellipse(cl.x+19,H*.22,23,12,0,0,Math.PI*2); pc.fill(); });
  birds.forEach(bird=>{ bird.x+=bird.sp; bird.w+=.15; if(bird.x>W+55) bird.x=-55; const wf=Math.sin(bird.w)*5; pc.strokeStyle=night>.5?'rgba(150,170,190,.7)':'#1a1a2a'; pc.lineWidth=2; pc.lineCap='round'; pc.beginPath(); pc.moveTo(bird.x+10, bird.y+wf); pc.quadraticCurveTo(bird.x+5, bird.y-4+wf, bird.x, bird.y); pc.quadraticCurveTo(bird.x-5, bird.y-4+wf, bird.x-10, bird.y+wf); pc.stroke(); });
  return sunX;
}

function drawEffects() {
  const night=nf(); if(night>.05){ gc.fillStyle=`rgba(5,5,25,${night*.6})`; gc.fillRect(0,0,game.width,game.height); }
  if(night>.25) fireflies.forEach(ff=>{ ff.x+=ff.spx+Math.sin(frame*.012+ff.ph)*.35; ff.y+=ff.spy+Math.cos(frame*.014+ff.ph)*.22; if(ff.x<0)ff.x=game.width; if(ff.x>game.width)ff.x=0; if(ff.y<0)ff.y=game.height; if(ff.y>game.height)ff.y=0; const bl=Math.sin(frame*.055+ff.ph*3)*.5+.5,al=bl*night*.85; gc.fillStyle=`rgba(230,255,150,${al})`; gc.beginPath(); gc.arc(ff.x,ff.y,1.5,0,Math.PI*2); gc.fill(); });
  drones.forEach(d=>drawDrone(gc,d));
}

function loop() {
  frame++; beeAngle+=.028;
  try {
    const sunX=drawPano();
    const earthGrad=gc.createLinearGradient(0,0,0,game.height);
    if(nf()>.5){earthGrad.addColorStop(0,'#0a1a05');earthGrad.addColorStop(1,'#050d02');} else if(season==='winter'){earthGrad.addColorStop(0,'#2a3a4a');earthGrad.addColorStop(1,'#1a2a3a');} else if(season==='autumn'){earthGrad.addColorStop(0,'#3a2a0a');earthGrad.addColorStop(1,'#2a1a05');} else {earthGrad.addColorStop(0,'#2a5a12');earthGrad.addColorStop(1,'#1a3a08');}
    gc.fillStyle=earthGrad; gc.fillRect(0,0,game.width,game.height);
    for(let i=0;i<20;i++) drawTile(i,sunX);
    drawEffects();
  } catch(e) { console.error("Loop error:", e); }
  requestAnimationFrame(loop);
}

// ═══════════════ ВВОД И UI ═══════════════
function getTile(cx2,cy2) { const rect=game.getBoundingClientRect(); const sx=game.width/rect.width,sy=game.height/rect.height; const px=(cx2-rect.left)*sx,py=(cy2-rect.top)*sy; return pixelToHex(px,py); }
game.addEventListener('touchstart',e=>{ e.preventDefault(); unlockAudio(); if(panelOpen){closePanel();return;} const i=getTile(e.touches[0].clientX,e.touches[0].clientY); if(i>=0) tapTile(i); },{passive:false});
game.addEventListener('click',e=>{ unlockAudio(); const i=getTile(e.clientX,e.clientY); if(i>=0) tapTile(i); });

function tapTile(i) {
  soundTile(S.grid[i] ? S.grid[i].t : null);
  if(S.grid[i]) { sp('info'); renderInfo(i); } else { sp('build'); renderBuild(); }
  S.sel=i;
}

function renderRes() { document.getElementById('rbar').innerHTML=RD.map(r=>`<div class="rc"><span class="ri">${r.i}</span><span class="rv">${fmt(S[r.k]||0)}</span></div>`).join(''); }

function renderBuild() {
  const lv=ulv();
  document.getElementById('bgrid').innerHTML=Object.entries(B).map(([k,bd])=>{
    const lk=bd.ul>lv, ok=!lk&&canAfford(bd.cost);
    const name = bd.n[currentLang] || bd.n.ua;
    const desc = bd.desc[currentLang] || bd.desc.ua;
    return `<div class="bcard ${lk?'no':ok?'ok':''}" onclick="doBuild('${k}')">
      <div class="bct"><span class="bci">${bd.i}</span><span class="bcn">${name}</span></div>
      <div class="bcd">${desc}</div>
      <div class="bcco">${fmtC(bd.cost)}${lk?` 🔒Lv${bd.ul}`:''}</div>
    </div>`;
  }).join('');
}

function doBuild(k) {
  if(S.sel===null||S.grid[S.sel]) return; const bd=B[k]; if(!canAfford(bd.cost)) { notify(L.notEnough+fmtC(bd.cost)); return; }
  Object.entries(bd.cost).forEach(([r,v])=>S[r]-=v); S.grid[S.sel]={t:k,lv:1}; S.built++; sBuild();
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  notify('✅ '+(bd.n[currentLang]||bd.n.ua)+' '+L.built); S.sel=null; renderBuild(); renderRes();
}

function renderInfo(i) {
  const b=S.grid[i]; if(!b) return; const bd=B[b.t]; const uc=Math.floor(50*Math.pow(2,b.lv-1));
  const name = bd.n[currentLang] || bd.n.ua;
  const desc = bd.desc[currentLang] || bd.desc.ua;
  document.getElementById('icontent').innerHTML=`<div class="ibox">
    <div class="it">${bd.i} ${name} · Lv${b.lv}</div>
    <div class="ir">⚙️ <strong>${bd.cy}</strong></div>
    <div class="ir">${desc}</div>
    <div class="ibtns">
      <button class="ibtn ibtn-u" onclick="doUpg(${i})" ${b.lv>=3||S.terra<uc?'disabled':''}>⬆ Lv${b.lv+1} · 💰${uc}</button>
      <button class="ibtn ibtn-d" onclick="doDel(${i})">🗑</button>
    </div>
  </div>`;
}

function doUpg(i) {
  const b=S.grid[i]; const uc=Math.floor(50*Math.pow(2,b.lv-1)); if(b.lv>=3){notify(L.maxLvl);return;} if(S.terra<uc){notify('⚠ 💰'+uc);return;}
  S.terra-=uc; b.lv++; sBuild(); notify(L.upgraded+' Lv'+b.lv); renderRes(); renderInfo(i);
}

function doDel(i) {
  const ref=Math.floor(B[S.grid[i].t].cost.terra*.5); S.terra+=ref; S.grid[i]=null; S.sel=null;
  notify(L.demolished+'💰'+ref); renderRes(); sp('build'); renderBuild();
}

const PANELS=['build','info','chain','stats'];
let panelOpen=false;
function sp(n) {
  const bottom=document.querySelector('.bottom');
  if(panelOpen && PANELS.indexOf(n)>=0) {
    const activePanel=PANELS[Array.from(document.querySelectorAll('.btab')).findIndex(t=>t.classList.contains('active'))];
    if(activePanel===n) { closePanel(); return; }
  }
  panelOpen=true; bottom.classList.add('open');
  document.querySelectorAll('.btab').forEach((t,i)=>t.classList.toggle('active',PANELS[i]===n));
  PANELS.forEach(p=>document.getElementById('panel-'+p).style.display=p===n?'':' none');
  if(n==='build') renderBuild();
  if(n==='stats') {
    document.getElementById('sgrid').innerHTML=[
      {l:L.stats.earned, v:fmt(S.totalTerra), g:true},
      {l:L.stats.cycles, v:S.cycles},
      {l:L.stats.built, v:S.built},
      {l:L.stats.pop, v:S.population}
    ].map(s=>`<div class="sbox"><div class="sbl">${s.l}</div><div class="sbv${s.g?' g':''}">${s.v}</div></div>`).join('');
  }
}

function togglePano() { const wrap=document.getElementById('panoWrap'), btn=document.getElementById('panoBtn'); wrap.classList.toggle('hidden'); btn.textContent=wrap.classList.contains('hidden')?'▼':'▲'; }
function closePanel() { panelOpen=false; document.querySelector('.bottom').classList.remove('open'); document.querySelectorAll('.btab').forEach(t=>t.classList.remove('active')); S.sel=null; }

// ═══════════════ ЭКОНОМИКА И ВРЕМЯ ═══════════════
setInterval(()=>{ seasonIdx=(seasonIdx+1)%4; season=SEASONS[seasonIdx]; notify(L.seasons[season]); }, 60000);
function runCycle() {
  S.cycles++; const mult=S.boost&&Date.now()<S.boostEnd?2:1;
  S.grid.forEach(b=>{
    if(!b) return; const bd=B[b.t];
    Object.entries(bd.prod).forEach(([k,v])=>{
      if(k!=='rare_seed') { const am=Math.floor(v*b.lv*mult); S[k]=(S[k]||0)+am; if(k==='terra') S.totalTerra+=am; }
    });
  });
  renderRes();
}
let cd=5;
setInterval(()=>{ cd--; document.getElementById('ct').textContent=cd; if(cd<=0){ cd=5; runCycle(); } }, 1000);

// ═══════════════ ОПЛАТА ═══════════════
async function buyStars() {
  unlockAudio(); sCoin();
  if (!tg?.initData) { activateBoost(); return; }
  try {
    const res = await fetch(`${API_URL}/api/create-invoice`, {
      method: "POST", headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg.initData },
      body: JSON.stringify({ productId: "boost" })
    });
    const data = await res.json();
    if (data.link) {
      tg.openInvoice(data.link, (status) => {
        if (status === "paid") { notify("⭐ " + L.boostTitle); activateBoost(); }
        else notify("❌ " + status);
      });
    } else notify("⚠ Error: " + (data.error || "unknown"));
  } catch(e) { notify("⚠ Network error"); }
}
function activateBoost() { S.terra+=200; S.totalTerra+=200; S.boost=true; S.boostEnd=Date.now()+60000; notify('⭐ BOOST ×2 — 60s!'); setTimeout(()=>{S.boost=false;},60000); renderRes(); }

// ═══════════════ СОХРАНЕНИЕ ═══════════════
async function save() {
  if (!tg?.initData) { try { localStorage.setItem('kh6', JSON.stringify(S)); } catch(e) {} return; }
  try {
    const dataToSave = { terra:S.terra, seeds:S.seeds, fiber:S.fiber, oil:S.oil, food:S.food, population:S.population, energy:S.energy, medicine_base:S.medicine_base, totalTerra:S.totalTerra, cycles:S.cycles, built:S.built, grid:S.grid, rareSeeds:S.rareSeeds, seasonIdx:seasonIdx };
    await fetch(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg.initData }, body: JSON.stringify(dataToSave) });
  } catch(e) { console.warn("Save failed:", e); }
}
async function load() {
  if (!tg?.initData) { try { const d=JSON.parse(localStorage.getItem('kh6')||'null'); if(d) Object.assign(S,d); } catch(e) {} return; }
  try {
    const res = await fetch(`${API_URL}/api/load`, { headers: { "X-Telegram-Init-Data": tg.initData } });
    const data = await res.json();
    if (data.found) { Object.assign(S, data.data); if(data.data.seasonIdx!==undefined){ seasonIdx=data.data.seasonIdx; season=SEASONS[seasonIdx]; } notify(L.saveOk); }
  } catch(e) { console.warn("Load failed:", e); }
}

// ═══════════════ СТАРТ ═══════════════
window.addEventListener('load', ()=>resize());
document.addEventListener('touchstart', unlockAudio, {once:true});
document.addEventListener('click', unlockAudio, {once:true});

load().then(() => {
  updateUI();
  renderRes();
  renderBuild();
  loop();
  setInterval(save, 15000);
});
</script>
