<script>
'use strict';
// ⚠️ ССЫЛКА НА ТВОЙ ВОРКЕР
const API_URL = "https://empire.qx420.workers.dev";

const pano=document.getElementById('panoCanvas');
const pc=pano.getContext('2d');
const game=document.getElementById('gameCanvas');
const gc=game.getContext('2d');
const COLS=5,ROWS=4;
let TW=76;

function resize(){
  const w=Math.min(window.innerWidth,430);
  TW=Math.floor(w/COLS);
  const hexH=Math.round(ROWS*44*1.5+44*2);
  game.width=w; game.height=hexH;
  const pw=Math.min(w-20,390);
  pano.width=pw; pano.height=90;
}
resize();
window.addEventListener('resize',resize);

const HEX_R = 44;
const HEX_W = HEX_R * Math.sqrt(3);
const HEX_H = HEX_R * 2;

function hexCenter(col, row) {
  const offX = (game.width - (COLS * HEX_W + HEX_W * 0.5)) / 2;
  const offY = HEX_R;
  const x = offX + col * HEX_W + (row % 2 === 1 ? HEX_W / 2 : 0) + HEX_W / 2;
  const y = offY + row * HEX_R * 1.5 + HEX_R;
  return {x, y};
}
function hexPath(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    const x = cx + r * Math.cos(a); const y = cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function pixelToHex(px, py) {
  let best = -1, bestDist = HEX_R * 1.1;
  for (let i = 0; i < COLS * ROWS; i++) {
    const col = i % COLS, row = Math.floor(i / COLS);
    const {x, y} = hexCenter(col, row);
    const d = Math.sqrt((px - x) ** 2 + (py - y) ** 2);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}
