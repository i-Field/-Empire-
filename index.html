<body>

<script>

const API_URL = "https://empire.qx420.workers.dev";

if (!['ua','ru','en'].includes(currentLang)) currentLang = 'ua';

const pano = document.getElementById('panoCanvas'), pc = pano.getContext('2d');
const game = document.getElementById('gameCanvas'), gc = game.getContext('2d');

// ═══════════ WEATHER & FX OBJECTS (З ПЕРШОЇ ВЕРСІЇ) ═══════════
let weather = 'clear';
const WEATHERS = ['clear','clear','clear','rain','fog','clear'];
setInterval(()=>{ weather = WEATHERS[Math.floor(Math.random()*WEATHERS.length)]; }, 25000);

const drones = [{x:40,y:28,tx:200,ty:22,sp:.7,led:0},{x:350,y:45,tx:100,ty:30,sp:.5,led:Math.PI}];
const clouds = [{x:60,sp:.22},{x:250,sp:.15},{x:140,sp:.1}];
const birds = [{x:-50,y:26,sp:.9,w:0},{x:-160,y:18,sp:.55,w:2},{x:-300,y:34,sp:1.1,w:4}];
const stars = Array.from({length:40}, ()=>({x:Math.random()*430,y:Math.random()*55,r:.5+Math.random(),ph:Math.random()*Math.PI*2}));

// ═══════════ TRANSLATIONS ═══════════
const TEXTS = {
  ua: { panoTitle:"🌿 ХУТІР RASTAMANIA", boostTitle:"МАГАЗИН", boostDesc:"Бонуси за Зірки", tabs:{build:"Будувати",info:"Будівля",quests:"Квести",top:"ТОП-10",friends:"Друзі",shop:"Магазин",stats:"Місто"}, notEnough:"⚠ Не вистачає: ", built:"✅ збудовано!", upgraded:"⬆ Апгрейд!", demolished:"🗑 Знесено +", maxLvl:"МАКС РІВЕНЬ", saveOk:"☁️ Збережено", selectTile:"Обери клітинку", seasons:{spring:"🌸 Весна",summer:"🌞 Літо",autumn:"🍂 Осінь",winter:"❄️ Зима"}, stats:{earned:"💰 Зароблено",cycles:"🔄 Циклів",built:"🏗 Будівель",pop:"👥 Населення"} },
  ru: { panoTitle:"🌿 ХУТОР RASTAMANIA", boostTitle:"МАГАЗИН", boostDesc:"Бонусы за Звезды", tabs:{build:"Строить",info:"Здание",quests:"Квесты",top:"ТОП-10",friends:"Друзья",shop:"Магазин",stats:"Город"}, notEnough:"⚠ Не хватает: ", built:"✅ построено!", upgraded:"⬆ Апгрейд!", demolished:"🗑 Снесено +", maxLvl:"МАКС УРОВЕНЬ", saveOk:"☁️ Сохранено", selectTile:"Выбери клетку", seasons:{spring:"🌸 Весна",summer:"🌞 Лето",autumn:"🍂 Осень",winter:"❄️ Зима"}, stats:{earned:"💰 Заработано",cycles:"🔄 Циклов",built:"🏗 Зданий",pop:"👥 Население"} },
  en: { panoTitle:"🌿 RASTAMANIA FARM", boostTitle:"SHOP", boostDesc:"Bonuses for Stars", tabs:{build:"Build",info:"Building",quests:"Quests",top:"TOP-10",friends:"Friends",shop:"Shop",stats:"City"}, notEnough:"⚠ Not enough: ", built:"✅ built!", upgraded:"⬆ Upgraded!", demolished:"🗑 Demolished +", maxLvl:"MAX LEVEL", saveOk:"☁️ Saved", selectTile:"Select a tile", seasons:{spring:"🌸 Spring",summer:"🌞 Summer",autumn:"🍂 Autumn",winter:"❄️ Winter"}, stats:{earned:"💰 Earned",cycles:"🔄 Cycles",built:"🏗 Buildings",pop:"👥 Population"} }
};
const L = TEXTS[currentLang];

function cycleLang() {
  const langs = ['ua', 'ru', 'en']; let idx = langs.indexOf(currentLang);
  currentLang = langs[(idx + 1) % langs.length]; localStorage.setItem('kh_lang', currentLang);
  updateUI(); renderBuild(); renderRes(); notify(currentLang === 'ua' ? "Мову змінено 🇺🇦" : currentLang === 'ru' ? "Язык изменен 🇷🇺" : "Language changed 🇬🇧");
}
function updateUI() {
  const l = TEXTS[currentLang];
  document.getElementById('langBtn').textContent = currentLang.toUpperCase();
  document.getElementById('panoTitle').textContent = l.panoTitle;
  document.getElementById('boostTitle').textContent = l.boostTitle;
  document.getElementById('boostDesc').textContent = l.boostDesc;
  document.getElementById('tab-t-build').textContent = l.tabs.build;
  document.getElementById('tab-t-info').textContent = l.tabs.info;
  document.getElementById('tab-t-quests').textContent = l.tabs.quests;
  document.getElementById('tab-t-shop').textContent = l.tabs.shop;
  document.getElementById('tab-t-top').textContent = l.tabs.top;
  document.getElementById('tab-t-friends').textContent = l.tabs.friends;
  document.getElementById('tab-t-stats').textContent = l.tabs.stats;
  if(!S.sel) document.getElementById('icontent').innerHTML = `<p style="text-align:center;color:rgba(200,160,50,.35);padding:18px 0;font-style:italic">${l.selectTile}</p>`;
}

let actx = null, mGain = null, musicOn = true, musicPlaying = false, mTimer = null, audioReady = false;

function unlockAudio() { if (audioReady) return; audioReady = true; try { getA().resume(); if (musicOn) startMusic(); } catch (e) {} }
function mkNoise(dur) { const a = getA(), buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return buf; }
function pOsc(f, t, type, dur, vol, dest) { try { const a = getA(), o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(dest || mGain); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.1, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.start(t); o.stop(t + dur); } catch (e) {} }
function pNoise(t, dur, freq, Q, vol) { try { const a = getA(), s = a.createBufferSource(); s.buffer = mkNoise(dur); const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = Q || 1; const g = a.createGain(); s.connect(f); f.connect(g); g.connect(mGain); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.08, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.start(t); s.stop(t + dur); } catch (e) {} }

function hexCenter(col, row) { const offX = (game.width - (COLS * HEX_W + HEX_W * 0.5)) / 2; const offY = HEX_R; const x = offX + col * HEX_W + (row % 2 === 1 ? HEX_W / 2 : 0) + HEX_W / 2; const y = offY + row * HEX_R * 1.5 + HEX_R; return { x, y }; }
function hexPath(ctx, cx, cy, r) { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; const x = cx + r * Math.cos(a); const y = cy + r * Math.sin(a); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.closePath(); }
function pixelToHex(px, py) { let best = -1, bestDist = HEX_R * 1.1; for (let i = 0; i < COLS * ROWS; i++) { const col = i % COLS, row = Math.floor(i / COLS); const { x, y } = hexCenter(col, row); const d = Math.sqrt((px - x) ** 2 + (py - y) ** 2); if (d < bestDist) { bestDist = d; best = i; } } return best; }
function fmt(n) { if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K'; return Math.floor(n) + ''; }

function drawMill(ctx,x,y,tw,f) { gnd(ctx,x,y,tw,tw,sgnd2(),sgnd()); const cx=x+tw*.5,gy=y+tw*.91; ctx.fillStyle=season==='winter'?'#d8e4f0':'#e8e0c0'; ctx.beginPath(); ctx.moveTo(cx-tw*.19,gy-tw*.58); ctx.lineTo(cx-tw*.12,gy); ctx.lineTo(cx+tw*.12,gy); ctx.lineTo(cx+tw*.19,gy-tw*.58); ctx.closePath(); ctx.fill(); ctx.fillStyle='#7a5830'; ctx.beginPath(); ctx.moveTo(cx-tw*.21,gy-tw*.58); ctx.lineTo(cx,gy-tw*.8); ctx.lineTo(cx+tw*.21,gy-tw*.58); ctx.closePath(); ctx.fill(); ctx.save(); ctx.translate(cx,gy-tw*.62); ctx.rotate(f*.04); ctx.fillStyle='#9a7038'; [[0],[Math.PI/2],[Math.PI],[Math.PI*1.5]].forEach(([a])=>{ ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(-2.5,0); ctx.lineTo(-4,-tw*.28); ctx.lineTo(4,-tw*.28); ctx.lineTo(2.5,0); ctx.closePath(); ctx.fill(); ctx.restore(); }); ctx.fillStyle='#503818'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function drawSolar(ctx,x,y,tw,f) { gnd(ctx,x,y,tw,tw,'#181808','#2a2808'); const cx=x+tw*.5,cy=y+tw*.5; ctx.fillStyle='#1a3870'; ctx.fillRect(cx-tw*.38,cy-tw*.3,tw*.76,tw*.5); ctx.fillStyle='#152e60'; for(let r=0;r<3;r++)for(let c=0;c<4;c++)ctx.fillRect(cx-tw*.36+c*tw*.18,cy-tw*.28+r*tw*.15,tw*.16,tw*.13); ctx.fillStyle='#585858'; ctx.fillRect(cx-2,cy+tw*.2,4,tw*.26); }
function drawBeehive(ctx,x,y,tw,f) { gnd(ctx,x,y,tw,tw,sgnd2(),sgnd()); const hx=x+tw*.5,hy=y+tw*.62; ctx.fillStyle='#d0a038'; ctx.beginPath(); ctx.ellipse(hx,hy,tw*.26,tw*.32,0,Math.PI,0,true); ctx.fill(); ctx.fillStyle='#a87828'; ctx.beginPath(); ctx.ellipse(hx,hy,tw*.28,tw*.06,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#2a1500'; ctx.beginPath(); ctx.ellipse(hx,hy+2,tw*.055,tw*.038,0,0,Math.PI*2); ctx.fill(); [0,2.1,4.2].forEach(off=>drawBee(ctx,hx+Math.cos(beeAngle+off)*tw*.38,hy-tw*.1+Math.sin(beeAngle+off)*tw*.16,beeAngle+off,f)); }
function drawGreenhouse(ctx,x,y,tw,f) { gnd(ctx,x,y,tw,tw,sgnd2(),sgnd()); const cx=x+tw*.5,gy=y+tw*.9,w=tw*.72,h=tw*.48; ctx.fillStyle=`rgba(160,220,200,${.22+Math.sin(f*.04)*.05})`; ctx.fillRect(cx-w/2,gy-h,w,h); ctx.strokeStyle='rgba(100,160,120,.7)'; ctx.lineWidth=1.5; ctx.strokeRect(cx-w/2,gy-h,w,h); }

function drawDrone(ctx,d) { const dx=d.tx-d.x,dy=d.ty-d.y,dist=Math.sqrt(dx*dx+dy*dy); if(dist<8){ d.tx=Math.random()*game.width; d.ty=20+Math.random()*50; } d.x+=dx/dist*d.sp; d.y+=dy/dist*d.sp; d.led+=.12; const bob=Math.sin(frame*.09)*3,angle=Math.atan2(dy,dx); ctx.save(); ctx.translate(d.x,d.y+bob); ctx.rotate(angle-Math.PI/2); ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(2,4,14,5,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#404040'; ctx.beginPath(); ctx.ellipse(0,0,10,7,0,0,Math.PI*2); ctx.fill(); [[-.7,-.65],[.7,-.65],[-.7,.65],[.7,.65]].forEach(([ax,ay])=>{ ctx.fillStyle='#444'; ctx.beginPath(); ctx.arc(ax*18,ay*10,4,0,Math.PI*2); ctx.fill(); }); ctx.restore(); }

// ═══════════ TILE RENDER ═══════════
function drawTile(idx,sunX) {
  const col=idx%COLS,row=Math.floor(idx/COLS); const {x:cx,y:cy}=hexCenter(col,row);
  const r=HEX_R-1; const TW2=r*2; const x=cx-r,y=cy-r;
  gc.save(); gc.translate(0, 5); hexPath(gc,cx,cy,r); gc.fillStyle='rgba(0,0,0,0.35)'; gc.fill(); gc.restore();
  hexPath(gc,cx,cy,r); gc.fillStyle=sgnd(); gc.fill();
  gc.save(); hexPath(gc,cx,cy,r); gc.clip();
  const b=S.grid[idx];
  try {
    if(b) {
      const t=b.t;
      if(t==='hemp_farm') { gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#2a600a'); [.2,.5,.8].forEach((rx,i)=>drawHempPlant(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.48+i*.04),frame)); }
      else if(t==='sunflower') { gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#3a700a'); [.2,.52,.82].forEach((rx,i)=>drawSunflower(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.44+i*.04),frame,sunX)); }
      else if(t==='corn_field') { gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#3a700a'); [.2,.5,.8].forEach((rx,i)=>drawCorn(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.52+i*.04),frame)); }
      else if(t==='poppy') { gnd(gc,cx-r,cy-r,TW2,TW2,'#180a28','#281040'); [[.17,.58,0],[.38,.64,1],[.6,.59,2],[.82,.55,3]].forEach(([rx,ry,i])=>drawPoppy(gc,cx-r+TW2*rx,cy-r+TW2*ry,TW2*.4,frame,i)); }
      else if(t==='beehive') drawBeehive(gc,cx-r,cy-r,TW2,frame);
      else if(t==='greenhouse') drawGreenhouse(gc,cx-r,cy-r,TW2,frame);
      else if(t==='house') drawHouse(gc,cx-r,cy-r,TW2,frame);
      else if(t==='mill') drawMill(gc,cx-r,cy-r,TW2,frame);
      else if(t==='solar') drawSolar(gc,cx-r,cy-r,TW2,frame);
      else drawFactory(gc,cx-r,cy-r,TW2,frame,'#906858',true);
      gc.fillStyle='rgba(0,0,0,.55)'; gc.fillRect(cx-r+2,cy-r+2,20,13);
      gc.fillStyle='#f0b828'; gc.font='bold 10px Russo One'; gc.textAlign='left'; gc.textBaseline='top'; gc.fillText('Lv'+b.lv,cx-r+3,cy-r+2);
      gc.fillStyle='rgba(0,0,0,.52)'; gc.fillRect(cx-r,cy+r-14,r*2,14);
      gc.fillStyle='#b0f048'; gc.font='8px sans-serif'; gc.textAlign='center'; gc.textBaseline='bottom'; gc.fillText(B[b.t]?.cy||'',cx,cy+r-1);
    } else drawEmpty(gc,cx-r,cy-r,TW2,frame);
  } catch(e) {}
  gc.restore();
  hexPath(gc,cx,cy,r);
  if(S.sel===idx) { const pulse=Math.sin(frame*.12)*.3+.7; gc.strokeStyle=`rgba(240,180,20,${pulse})`; gc.lineWidth=3; gc.fillStyle=`rgba(240,180,20,${pulse*.1})`; gc.fill(); gc.stroke(); }
  else { gc.strokeStyle='rgba(0,0,0,.45)'; gc.lineWidth=1.5; gc.stroke(); }
}

function drawPano() {
  const W=pano.width,H=pano.height,t=gt(),night=nf();
  let st,sb;
  if(night>.7){st='#040820';sb='#080c28';} else if(t<.3||t>.7){st='#e87020';sb='#f0a848';} else if(season==='winter'){st='#b0c8e0';sb='#d8e8f0';} else if(season==='autumn'){st='#c06820';sb='#e0a040';} else{st='#3888d8';sb='#80bce8';}
  const sky=pc.createLinearGradient(0,0,0,H*.6); sky.addColorStop(0,st); sky.addColorStop(1,sb); pc.fillStyle=sky; pc.fillRect(0,0,W,H*.6);
  const g1=season==='winter'?'#d0dce8':season==='autumn'?'#c09040':'#5ab030'; const g2=season==='winter'?'#b8c8d8':season==='autumn'?'#a07028':'#3a8018';
  const gnd2=pc.createLinearGradient(0,H*.6,0,H); gnd2.addColorStop(0,g1); gnd2.addColorStop(1,g2); pc.fillStyle=gnd2; pc.fillRect(0,H*.6,W,H*.4);
  if(night>.3) stars.forEach(s=>{ const tw2=Math.sin(frame*.04+s.ph)*.4+.6; pc.fillStyle=`rgba(255,255,240,${night*tw2*.85})`; pc.beginPath(); pc.arc(s.x,s.y,s.r,0,Math.PI*2); pc.fill(); });
  const sunX=W*(.08+t*.84),sunY=H*(.22+Math.sin(t*Math.PI)*(-.18));
  if(night<.9) { const sa=1-night,sg2=pc.createRadialGradient(sunX,sunY,0,sunX,sunY,28); sg2.addColorStop(0,`rgba(255,253,220,${sa})`); sg2.addColorStop(.4,`rgba(255,210,60,${sa})`); sg2.addColorStop(1,'rgba(255,180,40,0)'); pc.fillStyle=sg2; pc.fillRect(sunX-32,sunY-32,64,64); }
  clouds.forEach(cl=>{ cl.x+=cl.sp; if(cl.x>W+110)cl.x=-110; pc.fillStyle=`rgba(255,255,255,${night>.6?.25:.75})`; pc.beginPath(); pc.ellipse(cl.x,H*.2,36,15,0,0,Math.PI*2); pc.fill(); pc.beginPath(); pc.ellipse(cl.x-19,H*.22,21,13,0,0,Math.PI*2); pc.fill(); pc.beginPath(); pc.ellipse(cl.x+19,H*.22,23,12,0,0,Math.PI*2); pc.fill(); });
  birds.forEach(bird=>{ bird.x+=bird.sp; bird.w+=.15; if(bird.x>W+55) bird.x=-55; const wf=Math.sin(bird.w)*5; pc.strokeStyle=night>.5?'rgba(150,170,190,.7)':'#1a1a2a'; pc.lineWidth=2; pc.lineCap='round'; pc.beginPath(); pc.moveTo(bird.x+10, bird.y+wf); pc.quadraticCurveTo(bird.x+5, bird.y-4+wf, bird.x, bird.y); pc.quadraticCurveTo(bird.x-5, bird.y-4+wf, bird.x-10, bird.y+wf); pc.stroke(); });
  return sunX;
}

function drawEffects() {
  const night=nf(); if(night>.05){ gc.fillStyle=`rgba(5,5,25,${night*.6})`; gc.fillRect(0,0,game.width,game.height); }
  if(night>.25) fireflies.forEach(ff=>{ ff.x+=ff.spx+Math.sin(frame*.012+ff.ph)*.35; ff.y+=ff.spy+Math.cos(frame*.014+ff.ph)*.22; if(ff.x<0)ff.x=game.width; if(ff.x>game.width)ff.x=0; if(ff.y<0)ff.y=game.height; if(ff.y>game.height)ff.y=0; const bl=Math.sin(frame*.055+ff.ph*3)*.5+.5,al=bl*night*.85; gc.fillStyle=`rgba(230,255,150,${al})`; gc.beginPath(); gc.arc(ff.x,ff.y,1.5,0,Math.PI*2); gc.fill(); });
  drones.forEach(d=>drawDrone(gc,d));
  
  // WEATHER EFFECTS (RAIN & FOG)
  if(weather==='rain'){
    gc.strokeStyle='rgba(130,180,255,.38)'; gc.lineWidth=1;
    raindrops.forEach(d=>{ d.y+=d.sp; d.x-=d.sp*.2; if(d.y>game.height){d.y=-15; d.x=Math.random()*(game.width+40);} gc.beginPath(); gc.moveTo(d.x,d.y); gc.lineTo(d.x-2,d.y+d.len); gc.stroke(); });
  }
  if(weather==='fog'){
    fogBlobs.forEach(fb=>{ fb.x+=fb.sp; if(fb.x>game.width+200)fb.x=-200; const gr=gc.createRadialGradient(fb.x,fb.y,0,fb.x,fb.y,fb.w*.5); gr.addColorStop(0,`rgba(220,230,210,${fb.op})`); gr.addColorStop(1,'rgba(200,215,190,0)'); gc.fillStyle=gr; gc.beginPath(); gc.ellipse(fb.x,fb.y,fb.w*.5,fb.h*.5,0,0,Math.PI*2); gc.fill(); });
  }
}

function loop() { frame++; beeAngle+=.028; try { const sunX=drawPano(); const earthGrad=gc.createLinearGradient(0,0,0,game.height); if(nf()>.5){earthGrad.addColorStop(0,'#0a1a05');earthGrad.addColorStop(1,'#050d02');} else if(season==='winter'){earthGrad.addColorStop(0,'#2a3a4a');earthGrad.addColorStop(1,'#1a2a3a');} else if(season==='autumn'){earthGrad.addColorStop(0,'#3a2a0a');earthGrad.addColorStop(1,'#2a1a05');} else {earthGrad.addColorStop(0,'#2a5a12');earthGrad.addColorStop(1,'#1a3a08');} gc.fillStyle=earthGrad; gc.fillRect(0,0,game.width,game.height); for(let i=0;i<20;i++) drawTile(i,sunX); drawEffects(); } catch(e) { console.error(e); } requestAnimationFrame(loop); }

function getTile(cx2,cy2) { const rect=game.getBoundingClientRect(); const sx=game.width/rect.width,sy=game.height/rect.height; const px=(cx2-rect.left)*sx,py=(cy2-rect.top)*sy; return pixelToHex(px,py); }
game.addEventListener('touchstart',e=>{ e.preventDefault(); unlockAudio(); if(panelOpen){closePanel();return;} const i=getTile(e.touches[0].clientX,e.touches[0].clientY); if(i>=0) tapTile(i); },{passive:false});
game.addEventListener('click',e=>{ unlockAudio(); const i=getTile(e.clientX,e.clientY); if(i>=0) tapTile(i); });
function tapTile(i) { soundTile(S.grid[i] ? S.grid[i].t : null); if(S.grid[i]) { sp('info'); renderInfo(i); } else { sp('build'); renderBuild(); } S.sel=i; }
function renderRes() { document.getElementById('rbar').innerHTML=RD.map(r=>`<div class="rc"><span class="ri">${r.i}</span><span class="rv">${fmt(S[r.k]||0)}</span></div>`).join(''); }
function renderBuild() {
  const lv=ulv(); document.getElementById('bgrid').innerHTML=Object.entries(B).map(([k,bd])=>{
    const lk=bd.ul>lv, ok=!lk&&canAfford(bd.cost);
    const name = bd.n[currentLang] || bd.n.ua; const desc = bd.desc[currentLang] || bd.desc.ua;
    return `<div class="bcard ${lk?'no':ok?'ok':''}" onclick="doBuild('${k}')"><div class="bct"><span class="bci">${bd.i}</span><span class="bcn">${name}</span></div><div class="bcd">${desc}</div><div class="bcco">${fmtC(bd.cost)}${lk?` 🔒Lv${bd.ul}`:''}</div></div>`;
  }).join('');
}
function doBuild(k) {
  if(S.sel===null||S.grid[S.sel]) return; const bd=B[k]; if(!canAfford(bd.cost)) { notify(L.notEnough+fmtC(bd.cost)); return; }
  Object.entries(bd.cost).forEach(([r,v])=>S[r]-=v); S.grid[S.sel]={t:k,lv:1}; S.built++; sBuild();
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  notify('✅ '+(bd.n[currentLang]||bd.n.ua)+' '+L.built); S.sel=null; renderBuild(); renderRes(); checkQuests();
}
function renderInfo(i) {
  const b=S.grid[i]; if(!b) return; const bd=B[b.t]; const uc=Math.floor(50*Math.pow(2,b.lv-1));
  const name = bd.n[currentLang] || bd.n.ua; const desc = bd.desc[currentLang] || bd.desc.ua;
  document.getElementById('icontent').innerHTML=`<div class="ibox"><div class="it">${bd.i} ${name} · Lv${b.lv}</div><div class="ir">⚙️ <strong>${bd.cy}</strong></div><div class="ir">${desc}</div><div class="ibtns"><button class="ibtn ibtn-u" onclick="doUpg(${i})" ${b.lv>=3||S.terra<uc?'disabled':''}>⬆ Lv${b.lv+1} · 💰${uc}</button><button class="ibtn ibtn-d" onclick="doDel(${i})">🗑</button></div></div>`;
}
function doUpg(i) { const b=S.grid[i]; const uc=Math.floor(50*Math.pow(2,b.lv-1)); if(b.lv>=3){notify(L.maxLvl);return;} if(S.terra<uc){notify('⚠ 💰'+uc);return;} S.terra-=uc; b.lv++; sBuild(); notify(L.upgraded+' Lv'+b.lv); renderRes(); renderInfo(i); }
function doDel(i) { const ref=Math.floor(B[S.grid[i].t].cost.terra*.5); S.terra+=ref; S.grid[i]=null; S.sel=null; notify(L.demolished+'💰'+ref); renderRes(); sp('build'); renderBuild(); }

const PANELS=['build','info','quests','shop','top','friends','stats'];
function sp(n) {
  const bottom=document.querySelector('.bottom');
  if(panelOpen && PANELS.indexOf(n)>=0) { const activePanel=PANELS[Array.from(document.querySelectorAll('.btab')).findIndex(t=>t.classList.contains('active'))]; if(activePanel===n) { closePanel(); return; } }
  panelOpen=true; bottom.classList.add('open'); document.querySelectorAll('.btab').forEach((t,i)=>t.classList.toggle('active',PANELS[i]===n));
  PANELS.forEach(p=>document.getElementById('panel-'+p).style.display=p===n?'':' none');
  if(n==='build') renderBuild();
  if(n==='quests') renderQuests();
  if(n==='top') fetchLeaderboard();
  if(n==='shop') renderShop();
  if(n==='friends') renderFriends();
  if(n==='stats') { document.getElementById('sgrid').innerHTML=[{l:L.stats.earned, v:fmt(S.totalTerra), g:true},{l:L.stats.cycles, v:S.cycles},{l:L.stats.built, v:S.built},{l:L.stats.pop, v:S.population}].map(s=>`<div class="sbox"><div class="sbl">${s.l}</div><div class="sbv${s.g?' g':''}">${s.v}</div></div>`).join(''); }
}
function togglePano() { const wrap=document.getElementById('panoWrap'), btn=document.getElementById('panoBtn'); wrap.classList.toggle('hidden'); btn.textContent=wrap.classList.contains('hidden')?'▼':'▲'; }
function closePanel() { panelOpen=false; document.querySelector('.bottom').classList.remove('open'); document.querySelectorAll('.btab').forEach(t=>t.classList.remove('active')); S.sel=null; }

// ═══════════ CYCLE (З БОНУСАМИ ЕНЕРГІЇ ТА СЕЗОНУ) ═══════════
setInterval(()=>{ seasonIdx=(seasonIdx+1)%4; season=SEASONS[seasonIdx]; notify(L.seasons[season]); }, 60000);
function runCycle() { 
  S.cycles++; 
  const mult=S.boost&&Date.now()<S.boostEnd?2:1; 
  const eb = S.energy >= 2 ? 1.5 : 1; // Бонус енергії
  const seasonBonus = season === 'spring' ? 1.2 : season === 'winter' ? 0.7 : 1; // Бонус сезону
  
  S.grid.forEach(b=>{ 
    if(!b) return; const bd=B[b.t]; 
    Object.entries(bd.prod).forEach(([k,v])=>{ 
      if(k!=='rare_seed') { 
        let am=Math.floor(v*b.lv*mult*eb*seasonBonus); 
        if(S.autoCollect) am*=2; 
        S[k]=(S[k]||0)+am; 
        if(k==='terra') S.totalTerra+=am; 
      } 
    }); 
  }); 
  renderRes(); checkQuests(); 
}
let cd=5; setInterval(()=>{ cd--; document.getElementById('ct').textContent=cd; if(cd<=0){ cd=5; runCycle(); } }, 1000);

// ═══════════ SHOP & PAYMENTS ═══════════
async function buyProduct(id) {
  unlockAudio(); sCoin(); if (!tg?.initData) { applyReward(id); return; }
  try { const res = await fetch(`${API_URL}/api/create-invoice`, { method: "POST", headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg.initData }, body: JSON.stringify({ productId: id }) }); const data = await res.json(); if (data.link) { tg.openInvoice(data.link, (status) => { if (status === "paid") { applyReward(id); } else notify("❌ Скасовано"); }); } else notify("⚠ Помилка"); } catch(e) { notify("⚠ Мережа"); }
}
function applyReward(id) {
  if(id==='boost') { S.terra+=200; S.totalTerra+=200; S.boost=true; S.boostEnd=Date.now()+60000; setTimeout(()=>{S.boost=false;},60000); notify('⭐ Буст x2!'); }
  else if(id==='chest') { S.terra+=5000; S.seeds+=100; notify('🎁 Сундук відкрито!'); }
  else if(id==='auto') { S.autoCollect=true; notify('🚜 Авто-Фермер назавжди твій!'); }
  renderRes(); save();
}
function renderShop() {
  document.getElementById('panel-shop').innerHTML = `
    <div class="cv" style="display:flex; justify-content:space-between; align-items:center; padding:12px; margin-bottom:8px;"><div><div class="cvt">⭐ Зоряний Буст (50⭐)</div><div style="font-size:10px;color:#a09060;">Дохід x2 на 60 секунд</div></div><button onclick="buyProduct('boost')" style="background:#d09018; color:#000; border:none; padding:8px 12px; border-radius:6px; font-family:'Russo One';">КУПИТИ</button></div>
    <div class="cv" style="display:flex; justify-content:space-between; align-items:center; padding:12px; margin-bottom:8px;"><div><div class="cvt">🎁 Сундук (15⭐)</div><div style="font-size:10px;color:#a09060;">+5000💰 та +100🌱</div></div><button onclick="buyProduct('chest')" style="background:#d09018; color:#000; border:none; padding:8px 12px; border-radius:6px; font-family:'Russo One';">КУПИТИ</button></div>
    <div class="cv" style="display:flex; justify-content:space-between; align-items:center; padding:12px; margin-bottom:8px;"><div><div class="cvt">🚜 Авто-Фермер (150⭐)</div><div style="font-size:10px;color:#a09060;">Всі доходи x2 назавжди</div></div><button onclick="buyProduct('auto')" style="background:#d09018; color:#000; border:none; padding:8px 12px; border-radius:6px; font-family:'Russo One';">КУПИТИ</button></div>
  `;
}

// ═══════════ FRIENDS ═══════════
function renderFriends() {
  const uid = tg?.initDataUnsafe?.user?.id || "123";
  const link = `https://t.me/KhutorEmpireBot?start=ref_${uid}`;
  document.getElementById('panel-friends').innerHTML = `
    <div class="cv">
      <div class="cvt">🤝 Запроси друга</div>
      <p style="font-size:11px; color:#d8c060; margin-bottom:10px; line-height:1.4;">Запроси друга і отримай 500💰!</p>
      <input type="text" value="${link}" readonly style="width:100%; background:#111; color:#a0d040; border:1px solid #5a9a20; padding:8px; border-radius:5px; margin-bottom:10px; font-size:10px;">
      <button onclick="copyRef('${link}')" style="width:100%; background:#5a9a20; color:#fff; padding:10px; border:none; border-radius:5px; font-family:'Russo One'; cursor:pointer;">СКОПІЮВАТИ ЛІНК</button>
    </div>
  `;
}
function copyRef(link) { navigator.clipboard.writeText(link).then(()=>notify('✅ Лінк скопійовано!')).catch(()=>notify('❌ Помилка')); }

// ═══════════ WHEEL ═══════════
let isSpinning = false;
const WHEEL_PRIZES = [ { t: 'terra', v: 100, i: '💰' }, { t: 'seeds', v: 50, i: '🌱' }, { t: 'boost', v: 1, i: '⭐' }, { t: 'terra', v: 500, i: '💰' }, { t: 'food', v: 30, i: '🍞' }, { t: 'rare', v: 1, i: '🌟' }, { t: 'terra', v: 200, i: '💰' }, { t: 'seeds', v: 100, i: '🌱' } ];
function openWheel() { document.getElementById('wheelModal').classList.add('open'); updateWheelState(); }
function closeWheel() { document.getElementById('wheelModal').classList.remove('open'); }
function updateWheelState() { const btn = document.getElementById('spinBtn'); const now = Date.now(); const cooldown = 24 * 60 * 60 * 1000; if (S.lastSpin && now - S.lastSpin < cooldown) { btn.disabled = true; const left = Math.ceil((cooldown - (now - S.lastSpin)) / 3600000); btn.textContent = `⏳ ${left} год.`; } else { btn.disabled = false; btn.textContent = 'КРУТИТИ!'; } }
function spinWheel() {
  if (isSpinning) return; const now = Date.now(); const cooldown = 24 * 60 * 60 * 1000; if (S.lastSpin && now - S.lastSpin < cooldown) return;
  isSpinning = true; const btn = document.getElementById('spinBtn'); btn.disabled = true; btn.textContent = '...';
  const wheel = document.getElementById('wheelImg'); const randomDeg = Math.floor(Math.random() * 360); const totalRotations = 5 * 360; const finalDeg = totalRotations + randomDeg;
  wheel.style.transform = `rotate(${finalDeg}deg)`; sMachine();
  setTimeout(() => {
    const prizeIndex = Math.floor(randomDeg / 45) % WHEEL_PRIZES.length; const prize = WHEEL_PRIZES[prizeIndex];
    if (prize.t === 'boost') { applyReward('boost'); }
    else if (prize.t === 'rare') { S.rareSeeds.push({id:'w'+Date.now(), n:'Fortune Seed', i:'🌟', r:'Легендарне', c:'#c8500c', cnt:1}); notify('🌟 Рідкісне насіння!'); }
    else { S[prize.t] = (S[prize.t] || 0) + prize.v; if (prize.t === 'terra') S.totalTerra += prize.v; notify(`🎉 ВИГРАВ ${prize.i}${prize.v}!`); }
    S.lastSpin = now; S.quests.q_spin = 1; renderRes(); sCoin(); isSpinning = false; updateWheelState(); checkQuests();
    setTimeout(() => { wheel.style.transition = 'none'; wheel.style.transform = `rotate(${randomDeg}deg)`; setTimeout(()=>wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.1, 1)', 50); }, 4000);
  }, 4200);
}

// ═══════════ OFFLINE & LEADERBOARD & QUESTS ═══════════
let offlineReward = 0;
function checkOffline() {
  const now = Date.now(); const lastSeen = S.lastSeen || now; const diff = now - lastSeen;
  const maxOffline = 4 * 60 * 60 * 1000; const timeToPay = Math.min(diff, maxOffline);
  if (timeToPay > 60000) {
    let incomePerTick = 0;
    S.grid.forEach(b => { if (b && B[b.t] && B[b.t].prod.terra) incomePerTick += B[b.t].prod.terra * b.lv; });
    if (S.autoCollect) incomePerTick *= 2;
    const ticks = Math.floor(timeToPay / 5000);
    offlineReward = incomePerTick * ticks;
    if (offlineReward > 0) { document.getElementById('offlineAmount').textContent = fmt(offlineReward); document.getElementById('offlineModal').classList.add('open'); }
  }
}
function claimOffline() {
  if (offlineReward > 0) { S.terra += offlineReward; S.totalTerra += offlineReward; renderRes(); sCoin(); notify(`🎁 Отримано ${fmt(offlineReward)}💰!`); offlineReward = 0; }
  document.getElementById('offlineModal').classList.remove('open');
}

async function fetchLeaderboard() {
  const list = document.getElementById('lead-list'); list.innerHTML = '<p style="text-align:center;color:#a09060;">Завантаження...</p>';
  try {
    const res = await fetch(`${API_URL}/api/top`); const data = await res.json();
    if (data.top && data.top.length > 0) {
      list.innerHTML = data.top.map((p, i) => {
        const rank = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
        const isMe = p.name === (tg?.initDataUnsafe?.user?.first_name || "Гравець");
        return `<div class="lead-row ${isMe?'me':''}"><div class="lead-rank">${rank}</div><div class="lead-name">${p.name}</div><div class="lead-score">${fmt(p.score)} 💰</div></div>`;
      }).join('');
    } else { list.innerHTML = '<p style="text-align:center;color:#a09060;">Поки нікого немає.</p>'; }
  } catch (e) { list.innerHTML = '<p style="text-align:center;color:#d06060;">Помилка.</p>'; }
}

const QUESTS = [ { id: 'q_build', title: 'Збудувати 2 будівлі', reward: 5, target: 2 }, { id: 'q_earn', title: 'Заробити 1000 Терри', reward: 10, target: 1000 }, { id: 'q_spin', title: 'Прокрутити колесо', reward: 15, target: 1 } ];
function checkQuests() { let changed = false; if (S.built > (S.quests.q_build || 0)) { S.quests.q_build = S.built; changed = true; } if (S.totalTerra > (S.quests.q_earn || 0)) { S.quests.q_earn = S.totalTerra; changed = true; } if (changed && panelOpen && document.getElementById('panel-quests').style.display === 'block') renderQuests(); }
function renderQuests() {
  const container = document.getElementById('panel-quests'); if (!container) return;
  container.innerHTML = QUESTS.map(q => {
    const progress = S.quests[q.id] || 0; const isDone = progress >= q.target; const isClaimed = S.quests.claimed.includes(q.id);
    return `<div class="cv" style="display:flex; justify-content:space-between; align-items:center; padding:10px; margin-bottom:8px; border-color:${isDone&&!isClaimed?'#5a9a20':'rgba(200,160,50,.18)'}"><div><div style="font-family:'Russo One'; font-size:12px; color:#d8c060;">${q.title}</div><div style="font-size:10px; color:${isDone?'#80c020':'#a09060'}; margin-top:4px;">Прогрес: ${Math.min(progress, q.target)} / ${q.target}</div></div><div>${isClaimed ? '<span style="font-size:18px;">✅</span>' : `<button onclick="claimQuest('${q.id}')" ${isDone?'':'disabled'} style="background:${isDone?'#d09018':'#333'}; color:#000; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; font-family:'Russo One'; cursor:${isDone?'pointer':'default'}; box-shadow:${isDone?'0 0 10px #d09018':'none'};">⭐ ${q.reward}</button>`}</div></div>`;
  }).join('');
}
function claimQuest(qId) { const q = QUESTS.find(x => x.id === qId); if (!q || S.quests.claimed.includes(qId)) return; if ((S.quests[qId] || 0) < q.target) return; S.quests.claimed.push(qId); S.terra += q.reward * 100; S.totalTerra += q.reward * 100; notify(`✅ Нагорода: +${q.reward * 100}💰`); sCoin(); renderQuests(); renderRes(); save(); }
function checkReferral() { if (!tg?.initDataUnsafe?.start_param) return; const refCode = tg.initDataUnsafe.start_param; if (refCode.startsWith('ref_') && refCode !== `ref_${tg.initDataUnsafe.user?.id}`) { if (!S.refBonus) { S.terra += 500; S.totalTerra += 500; S.refBonus = true; notify("🎁 Бонус: +500💰!"); save(); } } }

// ═══════════ SAVE/LOAD ═══════════
async function save() {
  if (!tg?.initData) { try { localStorage.setItem('kh6', JSON.stringify(S)); } catch(e) {} return; }
  try { const dataToSave = { terra:S.terra, seeds:S.seeds, fiber:S.fiber, oil:S.oil, food:S.food, population:S.population, energy:S.energy, medicine_base:S.medicine_base, totalTerra:S.totalTerra, cycles:S.cycles, built:S.built, grid:S.grid, rareSeeds:S.rareSeeds, seasonIdx:seasonIdx, lastSpin:S.lastSpin, lastSeen:Date.now(), quests:S.quests, refBonus:S.refBonus, autoCollect:S.autoCollect }; await fetch(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg.initData }, body: JSON.stringify(dataToSave) }); } catch(e) {}
}
async function load() {
  if (!tg?.initData) { try { const d=JSON.parse(localStorage.getItem('kh6')||'null'); if(d) Object.assign(S,d); } catch(e) {} return; }
  try { const res = await fetch(`${API_URL}/api/load`, { headers: { "X-Telegram-Init-Data": tg.initData } }); const data = await res.json(); if (data.found) { Object.assign(S, data.data); if(data.data.seasonIdx!==undefined){ seasonIdx=data.data.seasonIdx; season=SEASONS[seasonIdx]; } notify(L.saveOk); } } catch(e) {}
}

// ═══════════ INIT ═══════════
window.addEventListener('load', ()=>resize());
document.addEventListener('touchstart', unlockAudio, {once:true});
document.addEventListener('click', unlockAudio, {once:true});

load().then(() => { updateUI(); checkReferral(); checkOffline(); renderRes(); renderBuild(); loop(); setInterval(save, 15000); });
</script>
