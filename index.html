html,body{height:100%;overflow:hidden;background:#1a3a0a;max-width:430px;margin:0 auto;}
body{display:flex;flex-direction:column;font-family:'PT Serif',serif;}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* TOPBAR */
.topbar{background:rgba(8,5,0,.98);border-bottom:1px solid rgba(100,80,20,.4);

.tb1{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:#a0d848;}

.tb-right{display:flex;align-items:center;gap:6px;}
.music-btn{background:rgba(20,50,0,.9);border:1.5px solid rgba(100,180,20,.5);

function resize(){
  const w=Math.min(window.innerWidth,430);
  TW=Math.floor(w/COLS);
  // Hex grid total height: rows*HEX_R*1.5 + HEX_R + HEX_R
  const hexH=Math.round(ROWS*44*1.5+44*2);
  game.width=w; game.height=hexH;
  // Pano width centered
  const pw=Math.min(w-20,390);
  pano.width=pw; pano.height=90;
}

// ═══ HEX GRID ═══
const HEX_R = 44; // radius
const HEX_W = HEX_R * Math.sqrt(3); // ~65.8px pointy-top width
const HEX_H = HEX_R * 2; // 76px height

function hexCenter(col, row) {
  const offX = (game.width - (COLS * HEX_W + HEX_W * 0.5)) / 2;
  const offY = HEX_R;
  const x = offX + col * HEX_W + (row % 2 === 1 ? HEX_W / 2 : 0) + HEX_W / 2;
  const y = offY + row * HEX_R * 1.5 + HEX_R;
  return {x, y};
}

function hexPath(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function pixelToHex(px, py) {
  let best = -1, bestDist = HEX_R * 1.1;
  for (let i = 0; i < COLS * ROWS; i++) {
    const col = i % COLS, row = Math.floor(i / COLS);
    const {x, y} = hexCenter(col, row);
    const d = Math.sqrt((px - x) ** 2 + (py - y) ** 2);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.floor(n)+'';}
function fmtC(c){return Object.entries(c).map(([k,v])=>`${RICONS[k]||k}${v}`).join(' ');}
function canAfford(c){return Object.entries(c).every(([k,v])=>(S[k]||0)>=v);}
function ulv(){return Math.floor(S.built/2);}
function notify(m){const el=document.getElementById('notif');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2500);}
const DAY=90000;
function gt(){return(Date.now()%DAY)/DAY;}
function nf(){const t=gt();if(t<.15||t>.85)return 1;if(t<.25)return 1-(t-.15)/.1;if(t>.75)return(t-.75)/.1;return 0;}

// ═══ AUDIO ENGINE ═══
let actx=null,mGain=null,musicOn=true,musicPlaying=false,mTimer=null,audioReady=false;
function getA(){
  if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}
  if(!mGain){mGain=actx.createGain();mGain.gain.value=.2;mGain.connect(actx.destination);}
  return actx;
}
function unlockAudio(){
  if(audioReady)return;audioReady=true;
  try{getA().resume();if(musicOn)startMusic();}catch(e){}
}
function mkNoise(dur){
  const a=getA(),buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return buf;
}
function pOsc(f,t,type,dur,vol,dest){
  try{const a=getA(),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(dest||mGain);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.1,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}
}
function pNoise(t,dur,freq,Q,vol){
  try{const a=getA(),s=a.createBufferSource();s.buffer=mkNoise(dur);
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=Q||1;
  const g=a.createGain();s.connect(f);f.connect(g);g.connect(mGain);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.08,t+.04);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.start(t);s.stop(t+dur);}catch(e){}
}
// Music: Chill Dub Cm-Fm-Bb-Gm
const BPM=75,BD=60/BPM;
const CH={Cm:[130.8,155.6,196],Fm:[174.6,207.7,261.6],Bb:[116.5,146.8,174.6],Gm:[98,116.5,146.8]};
const CS=['Cm','Cm','Fm','Fm','Bb','Gm','Cm','Cm'];
const BN={Cm:65.4,Fm:87.3,Bb:58.3,Gm:49};
function schedBar(t,bar){
  if(!musicPlaying)return;
  const ch=CH[CS[bar%8]],bn=BN[CS[bar%8]];
  ch.forEach(f=>{pOsc(f,t,'triangle',BD*3.8,.055);pOsc(f*2,t+BD*.1,'sine',BD*3.2,.018);});
  [0,2,3.5].forEach(o=>pOsc(bn,t+BD*o,'sine',BD*.35,.25));
  pOsc(bn*.5,t,'sine',BD*.8,.1);
  [1.5,3.5].forEach(o=>ch.forEach(f=>pOsc(f,t+BD*o,'square',BD*.12,.025)));
  [0,.5,1,1.5,2,2.5,3,3.5].forEach(o=>pNoise(t+BD*o,.07,8000,.8,o%1===0?.055:.025));
  [0,2].forEach(o=>{pNoise(t+BD*o,.14,80,.5,.1);pOsc(55,t+BD*o,'sine',.12,.15);});
  [1,3].forEach(o=>{pNoise(t+BD*o,.1,1500,.3,.07);pOsc(200,t+BD*o,'triangle',.05,.05);});
  if(bar%2===0){const n=[130.8,155.6,196,261.6,293.7][Math.floor(Math.random()*5)];pOsc(n*2,t+BD*(1+Math.random()*2),'sine',BD*.4,.06);}
  mTimer=setTimeout(()=>schedBar(t+BD*4,bar+1),(BD*4-.1)*1000);
}
function startMusic(){
  if(musicPlaying||!actx)return;musicPlaying=true;schedBar(actx.currentTime+.1,0);
  setTimeout(startNature,1000);
}
function stopMusic(){musicPlaying=false;clearTimeout(mTimer);}
function toggleMusic(){
  unlockAudio();musicOn=!musicOn;
  if(musicOn)startMusic();else stopMusic();
  document.getElementById('musicBtn').textContent=musicOn?'🎵':'🔇';
}
// Tile sounds
function sBird(){try{const a=getA(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.connect(g);g.connect(mGain);
  o.frequency.setValueAtTime(2200,t);o.frequency.setValueAtTime(2800,t+.06);o.frequency.setValueAtTime(2100,t+.12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
  o.start(t);o.stop(t+.18);}catch(e){}}
function sBees(){try{const a=getA(),t=a.currentTime,c=a.createOscillator(),m=a.createOscillator(),mg=a.createGain(),g=a.createGain();
  c.type='sawtooth';c.frequency.value=180;m.type='sine';m.frequency.value=120;mg.gain.value=80;
  m.connect(mg);mg.connect(c.frequency);c.connect(g);g.connect(mGain);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.1);g.gain.setValueAtTime(.15,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+.8);
  c.start(t);c.stop(t+.8);m.start(t);m.stop(t+.8);}catch(e){}}
function sWind(){try{const a=getA(),t=a.currentTime,s=a.createBufferSource();
  s.buffer=mkNoise(1);const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  const g=a.createGain();s.connect(f);f.connect(g);g.connect(mGain);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+1);
  s.start(t);s.stop(t+1);}catch(e){}}
function sLeaves(){pNoise(getA().currentTime,.5,3000,.5,.08);}
function sFire(){try{const a=getA(),t=a.currentTime,s=a.createBufferSource();
  s.buffer=mkNoise(.8);const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=350;
  const g=a.createGain();s.connect(f);f.connect(g);g.connect(mGain);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.1);g.gain.exponentialRampToValueAtTime(.0001,t+.8);
  s.start(t);s.stop(t+.8);[.1,.3,.55].forEach(d=>pNoise(t+d,.03,2000,.3,.04));}catch(e){}}
function sMachine(){[0,.1,.2,.35].forEach((d,i)=>{pOsc(80+i*20,getA().currentTime+d,'square',.08,.1);pNoise(getA().currentTime+d,.05,500,.5,.07);});}
function sBubbles(){[0,.08,.17,.28].forEach((d,i)=>pOsc(600+i*140,getA().currentTime+d,'sine',.12,.07));}
function sElectric(){pOsc(60,getA().currentTime,'sawtooth',.3,.08);pNoise(getA().currentTime,.3,3000,2,.04);}
function sCoin(){[1047,1319,1568].forEach((f,i)=>pOsc(f,getA().currentTime+i*.06,'sine',.15,.12));}
function sBuild(){[261,330,392,523].forEach((f,i)=>pOsc(f,getA().currentTime+i*.09,'triangle',.22,.15));}
function sBoost(){try{const a=getA(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(900,t+.5);
  o.connect(g);g.connect(mGain);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
  o.start(t);o.stop(t+.6);[.1,.22,.38].forEach(d=>pOsc(523,t+d,'sine',.1,.1));}catch(e){}}
function sCricket(){[3800,4000,4200].forEach((f,i)=>pOsc(f,getA().currentTime+i*.06,'square',.05,.022));}
function soundTile(type){
  if(!audioReady)return;

// ═══ CANVAS DRAWING ═══
function gnd(ctx,x,y,w,h,c1,c2){const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c1||'#3a6a18');g.addColorStop(1,c2||'#2a5010');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);}
const SG={spring:'#60e030',summer:'#40b020',autumn:'#b08010',winter:'#607060'};
const SGnd={spring:'#3a6a18',summer:'#2a5010',autumn:'#6a4a10',winter:'#506070'};
const SGnd2={spring:'#5a9030',summer:'#4a7a20',autumn:'#8a6020',winter:'#708090'};
function sg(){return SG[season];}function sgnd(){return SGnd[season];}function sgnd2(){return SGnd2[season];}

function drawHempLeaf(ctx,cx,cy,sz,angle,col){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.fillStyle=col;
  for(let f=0;f<5;f++){const fa=(f-2)*.42,fl=sz*(f===2?1:.68);
    ctx.save();ctx.rotate(fa);ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(-sz*.11,-fl*.35,-sz*.09,-fl*.82,0,-fl);
    ctx.bezierCurveTo(sz*.09,-fl*.82,sz*.11,-fl*.35,0,0);ctx.fill();ctx.restore();}ctx.restore();}

function drawHempPlant(ctx,cx,by,h,f){
  const sw=Math.sin(f*.025+cx)*2.5;ctx.strokeStyle='#2a7a18';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,by);ctx.lineTo(cx+sw,by-h);ctx.stroke();
  [[.35,12],[.55,10],[.72,8]].forEach(([fr,sz])=>{
    drawHempLeaf(ctx,cx+sw*fr-sz*.65,by-h*fr,sz,-.42,sg());
    drawHempLeaf(ctx,cx+sw*fr+sz*.65,by-h*fr,sz,.42,sg());});
  const nf2=nf();const gr=ctx.createRadialGradient(cx+sw,by-h,0,cx+sw,by-h,8);
  gr.addColorStop(0,`rgba(160,255,80,${.15+nf2*.45})`);gr.addColorStop(1,'rgba(60,180,10,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(cx+sw,by-h,7,10,0,0,Math.PI*2);ctx.fill();}

function drawSunflower(ctx,cx,by,h,f,sunX){
  const sw=Math.sin(f*.02+cx)*2;ctx.strokeStyle='#2a7a18';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,by);ctx.lineTo(cx+sw,by-h);ctx.stroke();
  ctx.fillStyle=sg();ctx.beginPath();ctx.ellipse(cx-11+sw,by-h*.5,13,5,-.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+11+sw,by-h*.55,13,5,.4,0,Math.PI*2);ctx.fill();
  const px=cx+sw,py=by-h,pr=9;
  const ta=Math.atan2(py-50,px-(sunX||200));
  ctx.save();ctx.translate(px,py);ctx.rotate(ta);
  for(let p=0;p<12;p++){const a=(p/12)*Math.PI*2;ctx.fillStyle=p%2===0?'#f5c020':'#e8a808';
    ctx.beginPath();ctx.ellipse(Math.cos(a)*pr*1.6,Math.sin(a)*pr*1.6,pr*.55,pr*.32,a,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#3a1800';ctx.beginPath();ctx.arc(0,0,pr,0,Math.PI*2);ctx.fill();ctx.restore();}

function drawCorn(ctx,cx,by,h,f){
  const sw=Math.sin(f*.022+cx)*2;ctx.strokeStyle='#2a8010';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,by);ctx.lineTo(cx+sw,by-h);ctx.stroke();
  ctx.fillStyle=sg();[[.3,-1],[.5,1],[.7,-1]].forEach(([fr,side])=>{
    ctx.beginPath();ctx.moveTo(cx+sw*fr,by-h*fr);
    ctx.quadraticCurveTo(cx+side*22+sw*fr,by-h*fr-8,cx+side*15+sw*fr,by-h*fr-22);
    ctx.quadraticCurveTo(cx+side*5+sw*fr,by-h*fr-9,cx+sw*fr,by-h*fr);ctx.fill();});
  if(season!=='winter'){const ex=cx+sw,ey=by-h*.58;
    ctx.fillStyle='#f0d040';ctx.beginPath();ctx.ellipse(ex+9,ey,5,13,.45,0,Math.PI*2);ctx.fill();}}

function drawPoppy(ctx,cx,by,h,f,i){
  const sw=Math.sin(f*.028+cx+i)*3;ctx.strokeStyle='#1a7018';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(cx,by);ctx.quadraticCurveTo(cx+sw*.4,by-h*.5,cx+sw,by-h);ctx.stroke();
  const px=cx+sw,py=by-h;
  ['#e82850','#c01030','#e04070','#f03060'].forEach((col,p)=>{
    const a=(p/4)*Math.PI*2+f*.005;ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(px+Math.cos(a)*7,py+Math.sin(a)*7,8,11,a,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#150612';ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fill();}

function drawBee(ctx,bx,by,angle,f){
  ctx.save();ctx.translate(bx,by);ctx.rotate(angle+Math.PI/2);
  ctx.fillStyle='#f0c020';ctx.beginPath();ctx.ellipse(0,0,3,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1000';ctx.fillRect(-3,-2,6,1.5);ctx.fillRect(-3,1,6,1.5);
  const wf=Math.sin(f*.5)*1.5;ctx.fillStyle='rgba(200,230,255,.75)';
  ctx.beginPath();ctx.ellipse(-4,-3+wf,4.5,2.5,-.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(4,-3+wf,4.5,2.5,.5,0,Math.PI*2);ctx.fill();ctx.restore();}

function drawHouse(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd());
  const cx=x+tw*.5,gy=y+tw*.91,bw=tw*.64,bh=tw*.43;
  ctx.fillStyle='#f0e8d0';ctx.fillRect(cx-bw/2,gy-bh,bw,bh);
  ctx.fillStyle=season==='winter'?'#c0d0e0':'#c8a038';
  ctx.beginPath();ctx.moveTo(cx-bw/2-5,gy-bh+2);ctx.lineTo(cx,gy-bh-tw*.33);ctx.lineTo(cx+bw/2+5,gy-bh+2);ctx.closePath();ctx.fill();
  const night=nf();const wc=night>.3?`rgba(255,200,80,${night*.9})`:' #87d4ff';
  [[cx-bw*.27,gy-bh+bh*.28],[cx+bw*.27,gy-bh+bh*.28]].forEach(([wx,wy])=>{
    if(night>.3){ctx.fillStyle=`rgba(255,180,50,${night*.3})`;ctx.beginPath();ctx.ellipse(wx,wy,18,14,0,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle=wc.trim();ctx.fillRect(wx-7,wy-7,14,14);});
  ctx.fillStyle='#5a2808';ctx.beginPath();ctx.rect(cx-7,gy-22,14,22);ctx.arc(cx,gy-22,7,Math.PI,0);ctx.fill();
  ctx.fillStyle='#604830';ctx.fillRect(cx+bw*.2,gy-bh-tw*.18,7,tw*.2);
  const st=(f*.4)%22;ctx.globalAlpha=Math.max(0,.55-st/22);
  ctx.fillStyle='rgba(210,190,170,.8)';ctx.beginPath();ctx.arc(cx+bw*.235,gy-bh-tw*.16-st,2+st*.12,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  if(season==='winter'){ctx.fillStyle='rgba(220,235,255,.5)';ctx.beginPath();ctx.moveTo(cx-bw/2-5,gy-bh+2);ctx.lineTo(cx,gy-bh-tw*.33);ctx.lineTo(cx+bw/2+5,gy-bh+2);ctx.closePath();ctx.fill();}}

function drawFactory(ctx,x,y,tw,f,col,smk){
  gnd(ctx,x,y,tw,tw,'#3a2a10','#604828');
  const cx=x+tw*.5,gy=y+tw*.91,bw=tw*.62,bh=tw*.48;
  ctx.fillStyle=col||'#b09068';ctx.fillRect(cx-bw/2,gy-bh,bw,bh);
  ctx.fillStyle='#85c0ff';[[.28,.36],[.72,.36],[.5,.62]].forEach(([rx,ry])=>ctx.fillRect(cx-bw/2+bw*rx-5,gy-bh+bh*ry-4,10,10));
  ctx.fillStyle='#3a2010';ctx.fillRect(cx-8,gy-20,16,20);
  [[.25,.18],[.75,.22]].forEach(([rx,rh])=>{
    ctx.fillStyle='#484030';ctx.fillRect(cx-bw/2+bw*rx-4,gy-bh-tw*rh,8,tw*rh+4);
    if(smk){const st=(f*.3+rx*10)%20;ctx.globalAlpha=Math.max(0,.45-st/20);
      ctx.fillStyle='rgba(180,160,140,.8)';ctx.beginPath();ctx.arc(cx-bw/2+bw*rx,gy-bh-tw*rh-st,2.5+st*.1,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}});}

function drawMill(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd());
  const cx=x+tw*.5,gy=y+tw*.91;
  ctx.fillStyle=season==='winter'?'#d8e4f0':'#e8e0c0';
  ctx.beginPath();ctx.moveTo(cx-tw*.19,gy-tw*.58);ctx.lineTo(cx-tw*.12,gy);ctx.lineTo(cx+tw*.12,gy);ctx.lineTo(cx+tw*.19,gy-tw*.58);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7a5830';ctx.beginPath();ctx.moveTo(cx-tw*.21,gy-tw*.58);ctx.lineTo(cx,gy-tw*.8);ctx.lineTo(cx+tw*.21,gy-tw*.58);ctx.closePath();ctx.fill();
  ctx.fillStyle='#85b8e8';ctx.beginPath();ctx.arc(cx,gy-tw*.38,5,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(cx,gy-tw*.62);ctx.rotate(f*.04);ctx.fillStyle='#9a7038';
  [[0],[Math.PI/2],[Math.PI],[Math.PI*1.5]].forEach(([a])=>{ctx.save();ctx.rotate(a);ctx.beginPath();ctx.moveTo(-2.5,0);ctx.lineTo(-4,-tw*.28);ctx.lineTo(4,-tw*.28);ctx.lineTo(2.5,0);ctx.closePath();ctx.fill();ctx.restore();});
  ctx.fillStyle='#503818';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.restore();}

function drawSolar(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,'#181808','#2a2808');
  const cx=x+tw*.5,cy=y+tw*.5;ctx.fillStyle='#1a3870';ctx.fillRect(cx-tw*.38,cy-tw*.3,tw*.76,tw*.5);

  const shi=Math.sin(f*.05)*.28+.25;ctx.fillStyle=`rgba(100,200,255,${shi})`;ctx.beginPath();ctx.ellipse(cx-tw*.1,cy-tw*.12,tw*.06,tw*.03,-.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#585858';ctx.fillRect(cx-2,cy+tw*.2,4,tw*.26);}

function drawBeehive(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd());
  [[.15,.76,'#f0c020'],[.85,.73,'#e060a0'],[.5,.78,'#60c0f0']].forEach(([rx,ry,c])=>{
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+tw*rx,y+tw*ry,3,0,Math.PI*2);ctx.fill();});
  const hx=x+tw*.5,hy=y+tw*.62;
  ctx.fillStyle='#d0a038';ctx.beginPath();ctx.ellipse(hx,hy,tw*.26,tw*.32,0,Math.PI,0,true);ctx.fill();
  ctx.fillStyle='#a87828';ctx.beginPath();ctx.ellipse(hx,hy,tw*.28,tw*.06,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#806018';ctx.lineWidth=1;
  for(let s=1;s<=3;s++){ctx.beginPath();ctx.ellipse(hx,hy-s*8,tw*(.265-s*.015),tw*.04,0,Math.PI,0,true);ctx.stroke();}
  ctx.fillStyle='#2a1500';ctx.beginPath();ctx.ellipse(hx,hy+2,tw*.055,tw*.038,0,0,Math.PI*2);ctx.fill();
  [0,2.1,4.2].forEach(off=>drawBee(ctx,hx+Math.cos(beeAngle+off)*tw*.38,hy-tw*.1+Math.sin(beeAngle+off)*tw*.16,beeAngle+off,f));}

function drawGreenhouse(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd());
  const cx=x+tw*.5,gy=y+tw*.9,w=tw*.72,h=tw*.48;
  const alpha=.22+Math.sin(f*.04)*.05;
  ctx.fillStyle=`rgba(160,220,200,${alpha})`;ctx.fillRect(cx-w/2,gy-h,w,h);
  ctx.fillStyle=`rgba(180,230,210,${alpha*.8})`;
  ctx.beginPath();ctx.ellipse(cx,gy-h,w/2,h*.55,0,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(100,160,120,.7)';ctx.lineWidth=1.5;ctx.strokeRect(cx-w/2,gy-h,w,h);
  ctx.beginPath();ctx.ellipse(cx,gy-h,w/2,h*.55,0,Math.PI,0);ctx.stroke();
  ctx.strokeStyle='#2a8020';ctx.lineWidth=1.5;
  for(let p=0;p<4;p++){const px=cx-w*.35+p*w*.22,py=gy-4;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.sin(f*.02+p),py-h*.3);ctx.stroke();
    ctx.fillStyle=sg();ctx.beginPath();ctx.arc(px+Math.sin(f*.02+p),py-h*.3,4,0,Math.PI*2);ctx.fill();}}

function drawMarket(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,'#2a1808','#4a2808');
  const cx=x+tw*.5,gy=y+tw*.91;
  ctx.fillStyle='#c09848';ctx.fillRect(cx-tw*.38,gy-tw*.24,tw*.76,tw*.24);
  [['#e03808',cx-tw*.25],['#f0b810',cx],['#38a838',cx+tw*.25]].forEach(([c,px])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(px,gy-tw*.3,5.5,0,Math.PI*2);ctx.fill();});
  const sw=['#e03808','#f0f0f0'];for(let s=0;s<8;s++){ctx.fillStyle=sw[s%2];ctx.beginPath();ctx.moveTo(cx-tw*.42+s*tw*.105,gy-tw*.5);ctx.lineTo(cx-tw*.42+s*tw*.105,gy-tw*.28);ctx.lineTo(cx-tw*.42+(s+1)*tw*.105,gy-tw*.28);ctx.lineTo(cx-tw*.42+(s+1)*tw*.105,gy-tw*.5);ctx.closePath();ctx.fill();}
  ctx.fillStyle='#e03808';for(let sc=0;sc<6;sc++){ctx.beginPath();ctx.arc(cx-tw*.38+sc*tw*.14,gy-tw*.28,tw*.07,0,Math.PI);ctx.fill();}
  ctx.fillStyle='#e8b840';ctx.fillRect(cx-tw*.2,gy-tw*.65,tw*.4,tw*.13);
  ctx.fillStyle='#3a1800';ctx.font=`bold ${tw*.068}px Russo One`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('РИНОК',cx,gy-tw*.585);}

function drawPharma(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,'#041820','#082830');
  const cx=x+tw*.5,cy=y+tw*.5,p=Math.sin(f*.08)*.3+.4;
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,tw*.5);
  gr.addColorStop(0,`rgba(0,200,100,${p})`);gr.addColorStop(1,'rgba(0,100,50,0)');
  ctx.fillStyle=gr;ctx.fillRect(x,y,tw,tw);
  const cs=tw*.19;ctx.fillStyle=`rgba(0,220,120,${.8+p*.2})`;
  ctx.fillRect(cx-cs,cy-cs*.4,cs*2,cs*.8);ctx.fillRect(cx-cs*.4,cy-cs,cs*.8,cs*2);}

function drawLab(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,'#08041a','#100830');
  const cx=x+tw*.5,cy=y+tw*.5,p=Math.sin(f*.07)*.3+.4;
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,tw*.48);

  ctx.fillStyle=gr;ctx.fillRect(x,y,tw,tw);
  ctx.fillStyle='rgba(80,180,255,.85)';ctx.beginPath();ctx.ellipse(cx,cy+tw*.1,tw*.2,tw*.14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(150,200,255,.7)';ctx.fillRect(cx-tw*.06,cy-tw*.2,tw*.12,tw*.3);}

function drawSeedBank(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,'#041404','#082808');
  const cx=x+tw*.5,cy=y+tw*.52,p=Math.sin(f*.06)*.25+.35;
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,tw*.48);
  gr.addColorStop(0,`rgba(200,160,30,${p})`);gr.addColorStop(1,'rgba(100,80,10,0)');
  ctx.fillStyle=gr;ctx.fillRect(x,y,tw,tw);
  ctx.fillStyle='#806020';ctx.beginPath();ctx.arc(cx,cy,tw*.32,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c0a030';ctx.beginPath();ctx.arc(cx,cy,tw*.28,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#e0c040';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,tw*.22,0,Math.PI*2);ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(f*.01);ctx.strokeStyle='#c0a030';ctx.lineWidth=2;
  for(let s=0;s<4;s++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(s*Math.PI/2)*tw*.18,Math.sin(s*Math.PI/2)*tw*.18);ctx.stroke();}
  ctx.restore();ctx.fillStyle='#ffe050';ctx.font=`${tw*.22}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',cx,cy+1);}

function drawEmpty(ctx,x,y,tw,f){
  gnd(ctx,x,y,tw,tw,sgnd2(),sgnd());
  const cx2=x+tw/2,cy2=y+tw/2;
  // Grass tufts
  ctx.strokeStyle=season==='winter'?'#708090':'#4a9a18';ctx.lineWidth=1.8;
  [[.18,.62],[.45,.38],[.78,.68],[.28,.8],[.65,.48],[.55,.72],[.35,.52]].forEach(([rx,ry])=>{
    const gx=x+tw*rx,gy=y+tw*ry,sw=Math.sin(f*.02+gx)*.8;
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+sw-1.5,gy-7);
    ctx.moveTo(gx,gy);ctx.lineTo(gx+sw+.5,gy-9);
    ctx.moveTo(gx,gy);ctx.lineTo(gx+sw+2,gy-6);ctx.stroke();});
  // Seasonal decorations
  if(season==='spring'){
    [[.3,.4,'#ff80c0'],[.7,.65,'#ffaa40'],[.5,.25,'#80d0ff']].forEach(([rx,ry,col])=>{
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+tw*rx,y+tw*ry,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#f0f020';ctx.beginPath();ctx.arc(x+tw*rx,y+tw*ry,1.2,0,Math.PI*2);ctx.fill();});
  } else if(season==='summer'){
    // Butterfly
    const bx=x+tw*.55,by=y+tw*.3,ba=Math.sin(f*.08)*.3;
    ctx.fillStyle='rgba(255,160,40,.7)';
    ctx.save();ctx.translate(bx,by);ctx.rotate(ba);
    ctx.beginPath();ctx.ellipse(-4,-2,5,3,-.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(4,-2,5,3,.5,0,Math.PI*2);ctx.fill();ctx.restore();
    // Mushroom
    ctx.fillStyle='#d04020';ctx.beginPath();ctx.arc(x+tw*.25,y+tw*.75,5,Math.PI,0);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(x+tw*.23,y+tw*.75,4,5);
  } else if(season==='autumn'){
    // Falling leaves
    [[.3,.5,'#e06020'],[.6,.3,'#c04010'],[.45,.7,'#d08020']].forEach(([rx,ry,col],i)=>{
      const lx=x+tw*rx+Math.sin(f*.03+i)*4,ly=y+tw*ry+Math.cos(f*.02+i)*2;
      ctx.fillStyle=col;ctx.save();ctx.translate(lx,ly);ctx.rotate(f*.02+i);
      ctx.beginPath();ctx.ellipse(0,0,5,3,0,0,Math.PI*2);ctx.fill();ctx.restore();});
  } else if(season==='winter'){
    ctx.fillStyle='rgba(220,235,255,.35)';ctx.fillRect(x,y,tw,tw);
    // Snowflakes
    [[.3,.4],[.65,.6],[.5,.25],[.8,.7]].forEach(([rx,ry])=>{
      const sx=x+tw*rx,sy=y+tw*ry;ctx.strokeStyle='rgba(220,235,255,.8)';ctx.lineWidth=1;
      for(let a=0;a<3;a++){const ang=a*Math.PI/3;ctx.beginPath();ctx.moveTo(sx-Math.cos(ang)*4,sy-Math.sin(ang)*4);ctx.lineTo(sx+Math.cos(ang)*4,sy+Math.sin(ang)*4);ctx.stroke();}});}
  // Plus hint (build here)
  const pulse=Math.sin(f*.04)*.15+.25;
  ctx.strokeStyle=`rgba(120,200,80,${pulse})`;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx2-8,cy2);ctx.lineTo(cx2+8,cy2);
  ctx.moveTo(cx2,cy2-8);ctx.lineTo(cx2,cy2+8);ctx.stroke();}

function drawDrone(ctx,d){
  const dx=d.tx-d.x,dy=d.ty-d.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<8){d.tx=Math.random()*game.width;d.ty=20+Math.random()*50;}
  d.x+=dx/dist*d.sp;d.y+=dy/dist*d.sp;d.led+=.12;
  const bob=Math.sin(frame*.09)*3,angle=Math.atan2(dy,dx);
  ctx.save();ctx.translate(d.x,d.y+bob);ctx.rotate(angle-Math.PI/2);
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(2,4,14,5,0,0,Math.PI*2);ctx.fill();
  // Body
  const bg=ctx.createLinearGradient(-10,-6,10,6);
  bg.addColorStop(0,'#505050');bg.addColorStop(1,'#282828');
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,10,7,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#606060';ctx.lineWidth=1;ctx.stroke();
  // Arms
  [[-.7,-.65],[.7,-.65],[-.7,.65],[.7,.65]].forEach(([ax,ay])=>{
    ctx.strokeStyle='#555';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ax*7,ay*4);ctx.lineTo(ax*18,ay*10);ctx.stroke();
    // Motor housing
    ctx.fillStyle='#444';ctx.beginPath();ctx.arc(ax*18,ay*10,4,0,Math.PI*2);ctx.fill();
    // Spinning rotor blur
    ctx.save();ctx.translate(ax*18,ay*10);ctx.rotate(frame*.4*ax);
    ctx.strokeStyle='rgba(200,200,200,.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(0,9);ctx.stroke();
    ctx.restore();
    // Rotor glow
    ctx.fillStyle='rgba(150,200,255,.15)';ctx.beginPath();ctx.arc(ax*18,ay*10,9,0,Math.PI*2);ctx.fill();
  });
  // Camera gimbal
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,3,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5090f0';ctx.beginPath();ctx.arc(0,3,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(150,200,255,.6)';ctx.beginPath();ctx.arc(-1,2,1,0,Math.PI*2);ctx.fill();
  // LED blink
  if(Math.sin(d.led)>.2){
    ctx.fillStyle='rgba(255,40,40,.95)';ctx.beginPath();ctx.arc(7,-3,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,100,100,.3)';ctx.beginPath();ctx.arc(7,-3,5,0,Math.PI*2);ctx.fill();
  }
  // Green status LED
  ctx.fillStyle=`rgba(40,255,80,${Math.sin(frame*.06)*.4+.6})`;
  ctx.beginPath();ctx.arc(-7,-3,2,0,Math.PI*2);ctx.fill();
  // Spotlight beam downward at night
  if(nf()>.3){
    const beamGrad=ctx.createLinearGradient(0,5,0,40);
    beamGrad.addColorStop(0,`rgba(255,240,150,${nf()*.3})`);
    beamGrad.addColorStop(1,'rgba(255,240,150,0)');
    ctx.fillStyle=beamGrad;ctx.beginPath();
    ctx.moveTo(-4,5);ctx.lineTo(4,5);ctx.lineTo(14,40);ctx.lineTo(-14,40);ctx.closePath();ctx.fill();
  }
  ctx.restore();}

// ═══ TILE DRAW ═══
function drawTile(idx,sunX){
  const col=idx%COLS,row=Math.floor(idx/COLS);
  const {x:cx,y:cy}=hexCenter(col,row);
  const r=HEX_R-1;
  const TW2=r*2;
  const x=cx-r,y=cy-r;
  // Draw hex background first
  hexPath(gc,cx,cy,r);
  gc.fillStyle=sgnd();
  gc.fill();
  // Clip to hex
  gc.save();
  hexPath(gc,cx,cy,r);
  gc.clip();
  const b=S.grid[idx];
  try{
    if(b){
      const t=b.t;
      if(t==='hemp_farm'){gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#2a600a');const gr=gc.createRadialGradient(cx,cy,0,cx,cy,TW2*.6);gr.addColorStop(0,`rgba(60,220,20,${.08+nf()*.2})`);gr.addColorStop(1,'rgba(20,140,5,0)');gc.fillStyle=gr;gc.fillRect(cx-r,cy-r,TW2,TW2);[.2,.5,.8].forEach((rx,i)=>drawHempPlant(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.48+i*.04),frame));}
      else if(t==='sunflower'){gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#3a700a');[.2,.52,.82].forEach((rx,i)=>drawSunflower(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.44+i*.04),frame,sunX));}
      else if(t==='corn_field'){gnd(gc,cx-r,cy-r,TW2,TW2,'#1a4008','#3a700a');[.2,.5,.8].forEach((rx,i)=>drawCorn(gc,cx-r+TW2*rx,cy+r*.6,TW2*(.52+i*.04),frame));}
      else if(t==='poppy'){gnd(gc,cx-r,cy-r,TW2,TW2,'#180a28','#281040');[[.17,.58,0],[.38,.64,1],[.6,.59,2],[.82,.55,3]].forEach(([rx,ry,i])=>drawPoppy(gc,cx-r+TW2*rx,cy-r+TW2*ry,TW2*.4,frame,i));}
      else if(t==='beehive')drawBeehive(gc,cx-r,cy-r,TW2,frame);
      else if(t==='greenhouse')drawGreenhouse(gc,cx-r,cy-r,TW2,frame);
      else if(t==='house')drawHouse(gc,cx-r,cy-r,TW2,frame);
      else if(t==='press')drawFactory(gc,cx-r,cy-r,TW2,frame,'#b09068',true);
      else if(t==='mill')drawMill(gc,cx-r,cy-r,TW2,frame);
      else if(t==='rope'){drawFactory(gc,cx-r,cy-r,TW2,frame,'#9a8048',false);gc.save();gc.translate(cx,cy);gc.rotate(frame*.02);for(let c=4;c>=1;c--){gc.strokeStyle=c%2?'#c0a040':'#a08028';gc.lineWidth=3;gc.beginPath();gc.arc(0,0,c*TW2*.1,0,Math.PI*1.8);gc.stroke();}gc.restore();}
      else if(t==='solar')drawSolar(gc,cx-r,cy-r,TW2,frame);
      else if(t==='market')drawMarket(gc,cx-r,cy-r,TW2,frame);
      else if(t==='pharma')drawPharma(gc,cx-r,cy-r,TW2,frame);
      else if(t==='lab')drawLab(gc,cx-r,cy-r,TW2,frame);
      else if(t==='seed_bank')drawSeedBank(gc,cx-r,cy-r,TW2,frame);
      else drawFactory(gc,cx-r,cy-r,TW2,frame,'#906858',true);
      gc.fillStyle='rgba(0,0,0,.55)';gc.fillRect(cx-r+2,cy-r+2,20,13);
      gc.fillStyle='#f0b828';gc.font='bold 10px Russo One';gc.textAlign='left';gc.textBaseline='top';gc.fillText('Lv'+b.lv,cx-r+3,cy-r+2);
      gc.fillStyle='rgba(0,0,0,.52)';gc.fillRect(cx-r,cy+r-14,r*2,14);
      gc.fillStyle='#b0f048';gc.font='8px sans-serif';gc.textAlign='center';gc.textBaseline='bottom';gc.fillText(B[b.t]?.cy||'',cx,cy+r-1);
    } else drawEmpty(gc,cx-r,cy-r,TW2,frame);
  }catch(e){console.warn('tile '+idx+':',e?.message);}
  gc.restore(); // end clip
  // Draw hex border on top
  hexPath(gc,cx,cy,r);
  if(S.sel===idx){
    // Pulsing gold selection
    const pulse=Math.sin(frame*.12)*.3+.7;
    gc.strokeStyle=`rgba(240,180,20,${pulse})`;gc.lineWidth=3;
    gc.fillStyle=`rgba(240,180,20,${pulse*.1})`;gc.fill();
    gc.stroke();
    // Outer glow ring
    hexPath(gc,cx,cy,r+4);
    gc.strokeStyle=`rgba(240,180,20,${pulse*.3})`;gc.lineWidth=2;
    gc.stroke();
  } else {
    // Subtle inner shadow border
    hexPath(gc,cx,cy,r);
    gc.strokeStyle='rgba(0,0,0,.45)';gc.lineWidth=1.5;gc.stroke();
    // Top highlight
    gc.strokeStyle='rgba(255,255,255,.08)';gc.lineWidth=1;
    gc.beginPath();
    const a0=Math.PI/6;
    gc.moveTo(cx+r*Math.cos(a0),cy+r*Math.sin(a0));
    for(let i=1;i<=2;i++){const a=a0+i*Math.PI/3;gc.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}
    gc.stroke();
  }}

// ═══ PANORAMA ═══
function drawPano(){
  const W=pano.width,H=pano.height,t=gt(),night=nf();
  let st,sb;
  if(night>.7){st='#040820';sb='#080c28';}
  else if(t<.3||t>.7){st='#e87020';sb='#f0a848';}
  else if(season==='winter'){st='#b0c8e0';sb='#d8e8f0';}
  else if(season==='autumn'){st='#c06820';sb='#e0a040';}
  else{st='#3888d8';sb='#80bce8';}
  const sky=pc.createLinearGradient(0,0,0,H*.6);sky.addColorStop(0,st);sky.addColorStop(1,sb);
  pc.fillStyle=sky;pc.fillRect(0,0,W,H*.6);
  const g1=season==='winter'?'#d0dce8':season==='autumn'?'#c09040':'#5ab030';
  const g2=season==='winter'?'#b8c8d8':season==='autumn'?'#a07028':'#3a8018';
  const gnd2=pc.createLinearGradient(0,H*.6,0,H);gnd2.addColorStop(0,g1);gnd2.addColorStop(1,g2);
  pc.fillStyle=gnd2;pc.fillRect(0,H*.6,W,H*.4);
  if(night>.3){stars.forEach(s=>{const tw2=Math.sin(frame*.04+s.ph)*.4+.6;pc.fillStyle=`rgba(255,255,240,${night*tw2*.85})`;pc.beginPath();pc.arc(s.x,s.y,s.r,0,Math.PI*2);pc.fill();});
    const mx=W*.8,my=H*.22;pc.fillStyle=`rgba(240,240,210,${night})`;pc.beginPath();pc.arc(mx,my,14,0,Math.PI*2);pc.fill();pc.fillStyle=st;pc.beginPath();pc.arc(mx+5,my-3,11,0,Math.PI*2);pc.fill();}
  const sunX=W*(.08+t*.84),sunY=H*(.22+Math.sin(t*Math.PI)*(-.18));
  if(night<.9){const sa=1-night,sg2=pc.createRadialGradient(sunX,sunY,0,sunX,sunY,28);
    sg2.addColorStop(0,`rgba(255,253,220,${sa})`);sg2.addColorStop(.4,`rgba(255,210,60,${sa})`);sg2.addColorStop(1,'rgba(255,180,40,0)');
    pc.fillStyle=sg2;pc.fillRect(sunX-32,sunY-32,64,64);
    pc.save();pc.translate(sunX,sunY);pc.rotate(frame*.008);pc.strokeStyle=`rgba(255,210,60,${sa*.28})`;pc.lineWidth=2;
    for(let r=0;r<8;r++){const ra=r*Math.PI/4;pc.beginPath();pc.moveTo(Math.cos(ra)*16,Math.sin(ra)*16);pc.lineTo(Math.cos(ra)*28,Math.sin(ra)*28);pc.stroke();}pc.restore();}
  clouds.forEach(cl=>{cl.x+=cl.sp;if(cl.x>W+110)cl.x=-110;
    pc.fillStyle=`rgba(255,255,255,${night>.6?.35:.82})`;
    pc.beginPath();pc.ellipse(cl.x,H*.2,36,15,0,0,Math.PI*2);pc.fill();
    pc.beginPath();pc.ellipse(cl.x-19,H*.22,21,13,0,0,Math.PI*2);pc.fill();
    pc.beginPath();pc.ellipse(cl.x+19,H*.22,23,12,0,0,Math.PI*2);pc.fill();});
  pc.fillStyle=night>.5?'rgba(20,40,15,.6)':'rgba(70,140,40,.45)';
  pc.beginPath();pc.moveTo(0,H*.6);pc.quadraticCurveTo(W*.25,H*.36,W*.5,H*.52);pc.quadraticCurveTo(W*.75,H*.38,W,H*.52);pc.lineTo(W,H*.6);pc.closePath();pc.fill();
  [.78,.86,.93].forEach((rx,i)=>{const tx=W*rx,ty=H*.6;pc.fillStyle='#4a2808';pc.fillRect(tx-3,ty-15,6,15);
    pc.fillStyle=night>.5?'#1a3010':['#3a8018','#4a9020','#2a6810'][i];pc.beginPath();pc.arc(tx,ty-22,14+i*3,0,Math.PI*2);pc.fill();});
  for(let h=0;h<9;h++){const hx=W*.3+h*20,hy=H*.6,sw=Math.sin(frame*.025+h)*2;
    pc.strokeStyle=night>.5?'#1a5010':'#3a8a18';pc.lineWidth=2;pc.beginPath();pc.moveTo(hx,hy);pc.lineTo(hx+sw,hy-22);pc.stroke();
    pc.fillStyle=`rgba(100,230,50,${night>.4?.12+night*.4:.1})`;pc.beginPath();pc.arc(hx+sw,hy-22,3,0,Math.PI*2);pc.fill();}
  const htx=W*.1,hty=H*.6;pc.fillStyle=night>.5?'#c0b890':'#f0e8d0';pc.fillRect(htx-22,hty-29,44,29);
  pc.fillStyle=season==='winter'?'#c0d0e0':'#c8a038';pc.beginPath();pc.moveTo(htx-26,hty-29);pc.lineTo(htx,hty-46);pc.lineTo(htx+26,hty-29);pc.closePath();pc.fill();
  const wc2=night>.3?`rgba(255,190,60,${night*.9})`:' #87d4ff';
  [[htx-13,hty-22],[htx+6,hty-22]].forEach(([wx,wy])=>{if(night>.3){pc.fillStyle=`rgba(255,160,40,${night*.35})`;pc.beginPath();pc.ellipse(wx+4,wy+4,14,10,0,0,Math.PI*2);pc.fill();}pc.fillStyle=wc2.trim();pc.fillRect(wx,wy,8,8);});
  pc.fillStyle='#4a2808';pc.fillRect(htx-5,hty-17,10,17);
  const st2=(frame*.4)%22;pc.globalAlpha=Math.max(0,.55-st2/22);pc.fillStyle='rgba(210,190,170,.8)';pc.beginPath();pc.arc(htx+13,hty-35-st2,2+st2*.1,0,Math.PI*2);pc.fill();pc.globalAlpha=1;
  for(let f2=0;f2<7;f2++){const fx=W*.2+f2*13;pc.fillStyle='#8a6030';pc.fillRect(fx-2,H*.56,4,12);}
  pc.strokeStyle='#a07838';pc.lineWidth=1.5;pc.beginPath();pc.moveTo(W*.18,H*.58);pc.lineTo(W*.2+6*13+2,H*.58);pc.stroke();
  birds.forEach(bird=>{bird.x+=bird.sp;bird.w+=.16;if(bird.x>W+55)bird.x=-55;
    const wf=Math.sin(bird.w)*4;pc.strokeStyle=night>.5?'rgba(120,140,160,.6)':'#1a1a2a';pc.lineWidth=1.5;pc.lineCap='round';
    pc.beginPath();pc.moveTo(bird.x+8,bird.y+wf);pc.quadraticCurveTo(bird.x+4,bird.y-3+wf,bird.x,bird.y);pc.quadraticCurveTo(bird.x-4,bird.y-3+wf,bird.x-8,bird.y+wf);pc.stroke();});
  if(weather==='fog'){pc.fillStyle='rgba(200,215,195,.2)';pc.fillRect(0,0,W,H);}
  // Update day info
  const hi=Math.floor(t*14);const hn=['🌙','🌙','🌙','🌅','🌅','🌤️','🌤️','🌤️','🌤️','🌤️','🌤️','🌆','🌆','🌙'][hi]||'🌙';
  const si={spring:'🌸',summer:'🌞',autumn:'🍂',winter:'❄️'}[season];
  const wi=weather==='rain'?'🌧️':weather==='fog'?'🌫️':'';
  document.getElementById('dayInfo').textContent=`${hn} ${si} ${wi}`;
  return sunX;}

// Night overlay + effects
function drawEffects(){
  const night=nf();
  if(night>.05){gc.fillStyle=`rgba(5,5,25,${night*.6})`;gc.fillRect(0,0,game.width,game.height);}
  if(night>.25)fireflies.forEach(ff=>{
    ff.x+=ff.spx+Math.sin(frame*.012+ff.ph)*.35;ff.y+=ff.spy+Math.cos(frame*.014+ff.ph)*.22;
    if(ff.x<0)ff.x=game.width;if(ff.x>game.width)ff.x=0;if(ff.y<0)ff.y=game.height;if(ff.y>game.height)ff.y=0;
    const bl=Math.sin(frame*.055+ff.ph*3)*.5+.5,al=bl*night*.85;
    const gr=gc.createRadialGradient(ff.x,ff.y,0,ff.x,ff.y,7);
    gr.addColorStop(0,`rgba(180,255,80,${al})`);gr.addColorStop(1,'rgba(80,200,30,0)');
    gc.fillStyle=gr;gc.beginPath();gc.arc(ff.x,ff.y,7,0,Math.PI*2);gc.fill();
    gc.fillStyle=`rgba(230,255,150,${al})`;gc.beginPath();gc.arc(ff.x,ff.y,1.5,0,Math.PI*2);gc.fill();});
  drones.forEach(d=>drawDrone(gc,d));
  if(weather==='rain'){gc.strokeStyle='rgba(130,180,255,.38)';gc.lineWidth=1;
    raindrops.forEach(d=>{d.y+=d.sp;d.x-=d.sp*.2;if(d.y>game.height){d.y=-15;d.x=Math.random()*(game.width+40);}
      gc.beginPath();gc.moveTo(d.x,d.y);gc.lineTo(d.x-2,d.y+d.len);gc.stroke();});}
  if(weather==='fog'){gc.fillStyle='rgba(200,215,195,.18)';gc.fillRect(0,0,game.width,game.height);}}

// ═══ MAIN LOOP ═══
function loop(){
  frame++;beeAngle+=.028;
  try{
    const sunX=drawPano();
    // Rich earth background
    const earthGrad=gc.createLinearGradient(0,0,0,game.height);
    if(nf()>.5){
      earthGrad.addColorStop(0,'#0a1a05');earthGrad.addColorStop(1,'#050d02');
    } else if(season==='winter'){
      earthGrad.addColorStop(0,'#2a3a4a');earthGrad.addColorStop(1,'#1a2a3a');
    } else if(season==='autumn'){
      earthGrad.addColorStop(0,'#3a2a0a');earthGrad.addColorStop(1,'#2a1a05');
    } else {
      earthGrad.addColorStop(0,'#2a5a12');earthGrad.addColorStop(1,'#1a3a08');
    }
    gc.fillStyle=earthGrad;gc.fillRect(0,0,game.width,game.height);
    // Path between hexes (dirt roads)
    gc.strokeStyle='rgba(120,80,30,.2)';gc.lineWidth=2;
    for(let i=0;i<COLS*ROWS;i++){
      const {x:hx,y:hy}=hexCenter(i%COLS,Math.floor(i/COLS));
      if(i+1<COLS*ROWS&&(i+1)%COLS!==0){
        const {x:nx,y:ny}=hexCenter((i+1)%COLS,Math.floor((i+1)/COLS));
        gc.beginPath();gc.moveTo(hx,hy);gc.lineTo(nx,ny);gc.stroke();
      }
    }
    for(let i=0;i<20;i++)drawTile(i,sunX);
    // Hex borders drawn per tile
    drawEffects();
  }catch(e){console.warn('loop',e);}
  requestAnimationFrame(loop);}

// ═══ INPUT ═══
function getTile(cx2,cy2){
  const rect=game.getBoundingClientRect();
  const sx=game.width/rect.width,sy=game.height/rect.height;
  const px=(cx2-rect.left)*sx,py=(cy2-rect.top)*sy;
  return pixelToHex(px,py);}
game.addEventListener('touchstart',e=>{e.preventDefault();unlockAudio();
  if(panelOpen){closePanel();return;}
  const i=getTile(e.touches[0].clientX,e.touches[0].clientY);if(i>=0)tapTile(i);},{passive:false});
game.addEventListener('click',e=>{unlockAudio();
  const i=getTile(e.clientX,e.clientY);if(i>=0)tapTile(i);});
function tapTile(i){
  soundTile(S.grid[i]?S.grid[i].t:null);
  S.sel=i;
  if(S.grid[i]){sp('info');renderInfo(i);}
  else{sp('build');renderBuild();}
}

// ═══ UI ═══
function renderRes(){document.getElementById('rbar').innerHTML=RD.map(r=>`<div class="rc"><span class="ri">${r.i}</span><span class="rv">${fmt(S[r.k]||0)}</span></div>`).join('');}
function renderBuild(){const lv=ulv();document.getElementById('bgrid').innerHTML=Object.entries(B).map(([k,bd])=>{const lk=bd.ul>lv,ok=!lk&&canAfford(bd.cost);return`<div class="bcard ${lk?'no':ok?'ok':''}" onclick="doBuild('${k}')"><div class="bct"><span class="bci">${bd.i}</span><span class="bcn">${bd.n}</span></div><div class="bcd">${bd.desc}</div><div class="bcc">⛓ ${bd.ch}</div><div class="bcco">${fmtC(bd.cost)}${lk?` 🔒Lv${bd.ul}`:''}</div></div>`;}).join('');}
function doBuild(k){if(S.sel===null||S.grid[S.sel])return;const bd=B[k];if(!canAfford(bd.cost)){notify('⚠ Не вистачає: '+fmtC(bd.cost));return;}Object.entries(bd.cost).forEach(([r,v])=>S[r]-=v);S.grid[S.sel]={t:k,lv:1};S.built++;if(Math.random()<.18)dropSeed();sBuild();notify('✅ '+bd.n+' збудовано!');S.sel=null;renderBuild();renderRes();}
function renderInfo(i){const b=S.grid[i];if(!b)return;const bd=B[b.t];const uc=Math.floor(50*Math.pow(2,b.lv-1));document.getElementById('icontent').innerHTML=`<div class="ibox"><div class="it">${bd.i} ${bd.n} · Lv${b.lv}</div><div class="ir">⚙️ <strong>${bd.cy}</strong></div><div class="ir">⛓ ${bd.ch}</div>${Object.keys(bd.cons).length?`<div class="ir">🔻 <strong>${fmtC(bd.cons)}/цикл</strong></div>`:''}<div class="ir">${bd.desc}</div><div class="ibtns"><button class="ibtn ibtn-u" onclick="doUpg(${i})" ${b.lv>=3||S.terra<uc?'disabled':''}>⬆ Lv${b.lv+1} · 💰${uc}</button><button class="ibtn ibtn-d" onclick="doDel(${i})">🗑 Знести</button></div></div>`;}
function doUpg(i){const b=S.grid[i];const uc=Math.floor(50*Math.pow(2,b.lv-1));if(b.lv>=3){notify('MAX!');return;}if(S.terra<uc){notify('⚠ 💰'+uc);return;}S.terra-=uc;b.lv++;sBuild();notify('⬆ Lv'+b.lv+'!');renderRes();renderInfo(i);}
function doDel(i){const ref=Math.floor(B[S.grid[i].t].cost.terra*.5);S.terra+=ref;S.grid[i]=null;S.sel=null;notify('🗑 +💰'+ref);renderRes();sp('build');renderBuild();}
function renderChain(){document.getElementById('panel-chain').innerHTML=`<div class="cv"><div class="cvt">🌿 Конопляний ланцюжок</div><div class="cvr"><span class="cvn">🌿 Ферма</span><span class="cva">→</span><span class="cvn">🌱 Насіння</span><span class="cva">→</span><span class="cvn">⚙️ Прес</span></div><div class="cvr"><span class="cvn">🧵 Волокно</span><span class="cva">→</span><span class="cvn">Канати · Тканина · Пластик</span></div><div class="cvr"><span class="cvn">🫗 Олія</span><span class="cva">→</span><span class="cvn">Ліки · Фарба · Лак</span></div></div><div class="cv"><div class="cvt">🌻🌽🐝 Агро-екосистема</div><div class="cvr"><span class="cvn">🌻 Соняшник → 🫗+🍞</span></div><div class="cvr"><span class="cvn">🌽 Кукурудза → 🍞 → 👥 → 💰</span></div><div class="cvr"><span class="cvn">🐝 Пасіка → 💰+🍞</span></div></div><div class="cv"><div class="cvt">🌿 NFT Насіння → TON</div><div class="cvr"><span class="cvn">🫙 Банк насіння → 🌟 → NFT</span></div></div>`;}
const RARE2=[{id:'terra_og',n:'Terra OG',i:'🌿',r:'Звичайне',c:'#4a9e3f'},{id:'golden_hemp',n:'Golden Hemp',i:'✨',r:'Рідкісне',c:'#c8960c'},{id:'sky_bloom',n:'Sky Bloom',i:'💫',r:'Епічне',c:'#7a4acc'},{id:'solar_kush',n:'Solar Kush',i:'☀️',r:'Легендарне',c:'#c8500c'},{id:'ice_crystal',n:'Ice Crystal',i:'❄️',r:'Унікальне',c:'#2080c0'}];
function dropSeed(){const s=RARE2[Math.floor(Math.random()*RARE2.length)];const ex=S.rareSeeds.find(x=>x.id===s.id);if(ex)ex.cnt=(ex.cnt||1)+1;else S.rareSeeds.push({...s,cnt:1});notify('🌟 '+s.n+'!');}
function renderSeeds(){document.getElementById('scontent').innerHTML=`<div style="background:rgba(15,45,5,.85);border:1px solid rgba(90,180,40,.3);border-radius:8px;padding:9px;margin-bottom:6px;"><div style="font-family:'Russo One',sans-serif;font-size:13px;color:#90c030;margin-bottom:3px;">🌿 Колекція Насіння</div><div style="font-size:9px;color:rgba(130,190,60,.6);margin-bottom:7px;">Рідкісне насіння — NFT на TON · Getgems.io</div><div style="display:flex;flex-wrap:wrap;gap:4px;">${S.rareSeeds.length?S.rareSeeds.map(s=>`<div style="background:rgba(255,255,255,.05);border:1px solid rgba(190,150,35,.28);border-radius:7px;padding:3px 6px;display:flex;align-items:center;gap:4px;"><span>${s.i}</span><div><div style="font-size:9px;color:#c8a858">${s.n} ×${s.cnt}</div><div style="font-size:7px;color:${s.c}">${s.r}</div></div></div>`).join(''):'<span style="color:rgba(130,190,60,.3);font-size:9px;font-style:italic">Будуй і грай!</span>'}</div></div>`;}
function renderStats(){const built=S.grid.filter(Boolean).length;const aps=S.grid.reduce((s,b)=>{if(!b)return s;return s+(B[b.t]?.prod?.terra||0)*b.lv;},0)+S.population*.5;const sn={spring:'Весна🌸',summer:'Літо🌞',autumn:'Осінь🍂',winter:'Зима❄️'}[season];const wn={clear:'Ясно☀️',rain:'Дощ🌧️',fog:'Туман🌫️'}[weather];document.getElementById('sgrid').innerHTML=[{l:'💰 Зароблено',v:fmt(S.totalTerra),g:true},{l:'🔄 Циклів',v:S.cycles},{l:'🏗 Будівель',v:built},{l:'👥 Населення',v:S.population},{l:'⚡ Терра/цикл',v:fmt(aps),g:true},{l:'🌟 NFT',v:S.rareSeeds.length},{l:'🍂 Сезон',v:sn},{l:'🌤️ Погода',v:wn}].map(s=>`<div class="sbox"><div class="sbl">${s.l}</div><div class="sbv${s.g?' g':''}" style="font-size:${s.v.length>8?'12px':'20px'}">${s.v}</div></div>`).join('');}
const PANELS=['build','info','chain','seeds','stats'];
let panelOpen=false;
function sp(n){
  const bottom=document.querySelector('.bottom');
  if(panelOpen && PANELS.indexOf(n)>=0){
    const wasActive=document.querySelector('.btab.active');
    const activePanel=PANELS[Array.from(document.querySelectorAll('.btab')).findIndex(t=>t.classList.contains('active'))];
    if(activePanel===n){closePanel();return;}
  }
  panelOpen=true;
  bottom.classList.add('open');
  document.querySelectorAll('.btab').forEach((t,i)=>t.classList.toggle('active',PANELS[i]===n));
  PANELS.forEach(p=>document.getElementById('panel-'+p).style.display=p===n?'':' none');
  if(n==='build')renderBuild();if(n==='chain')renderChain();
  if(n==='seeds')renderSeeds();if(n==='stats')renderStats();
}
function togglePano(){
  const wrap=document.getElementById('panoWrap');
  const btn=document.getElementById('panoBtn');
  wrap.classList.toggle('hidden');
  btn.textContent=wrap.classList.contains('hidden')?'▼':'▲';
}
function closePanel(){
  panelOpen=false;
  document.querySelector('.bottom').classList.remove('open');
  document.querySelectorAll('.btab').forEach(t=>t.classList.remove('active'));
  S.sel=null;
}

// ═══ CYCLE ═══
setInterval(()=>{seasonIdx=(seasonIdx+1)%4;season=SEASONS[seasonIdx];notify({spring:'🌸 Весна!',summer:'🌞 Літо!',autumn:'🍂 Осінь!',winter:'❄️ Зима!'}[season]);sBuild();},60000);
setInterval(()=>{const ws=['clear','clear','clear','rain','fog','clear'];weather=ws[Math.floor(Math.random()*ws.length)];},25000);
function runCycle(){S.cycles++;const mult=S.boost&&Date.now()<S.boostEnd?2:1;const eb=S.energy>=2?1.5:1;const sb2=season==='spring'?1.2:season==='winter'?.7:1;
  S.grid.forEach(b=>{if(!b)return;const bd=B[b.t];const ok=Object.entries(bd.cons).every(([k,v])=>(S[k]||0)>=v);if(!ok)return;Object.entries(bd.cons).forEach(([k,v])=>S[k]=Math.max(0,(S[k]||0)-v));Object.entries(bd.prod).forEach(([k,v])=>{if(k==='rare_seed'){if(Math.random()<v*b.lv*mult)dropSeed();}else{const am=Math.floor(v*b.lv*mult*eb*sb2);S[k]=(S[k]||0)+am;if(k==='terra'){S.totalTerra+=am;if(am>0&&Math.random()<.25)sCoin();}}});});
  if(S.population>0){const pb=Math.floor(S.population*.5*mult);S.terra+=pb;S.totalTerra+=pb;}
  Object.keys(S).forEach(k=>{if(typeof S[k]==='number'&&S[k]<0)S[k]=0;});renderRes();}
const CYC=5;let cd=CYC;
setInterval(()=>{cd--;document.getElementById('ct').textContent=cd;if(cd<=0){cd=CYC;runCycle();}},1000);

// ═══ STARS ═══
function buyStars(){
  unlockAudio();sBoost();
  const inTg=!!(tg?.initData);
  if(inTg&&tg?.openInvoice){tg.openInvoice({title:'Зоряний Буст',description:'+200💰 ×2 60сек',payload:'boost',provider_token:'',currency:'XTR',prices:[{label:'Буст',amount:50}]},st=>{if(st==='paid')activateBoost();else notify('❌ '+st);});}
  else activateBoost();}
function activateBoost(){S.terra+=200;S.totalTerra+=200;S.boost=true;S.boostEnd=Date.now()+60000;notify('⭐ БУСТ ×2 — 60 СЕК!');setTimeout(()=>{S.boost=false;notify('⏰ Буст завершено');},60000);renderRes();}

// ═══ SAVE/LOAD ═══
function save(){
  const d={terra:S.terra,seeds:S.seeds,fiber:S.fiber,oil:S.oil,food:S.food,population:S.population,energy:S.energy,medicine_base:S.medicine_base,totalTerra:S.totalTerra,cycles:S.cycles,built:S.built,grid:S.grid,rareSeeds:S.rareSeeds,seasonIdx};
  try{localStorage.setItem('kh6',JSON.stringify(d));}catch(e){}
  if(tg?.CloudStorage){const res=JSON.stringify({terra:S.terra,seeds:S.seeds,fiber:S.fiber,oil:S.oil,food:S.food,population:S.population,energy:S.energy,medicine_base:S.medicine_base,totalTerra:S.totalTerra,cycles:S.cycles,built:S.built,seasonIdx});tg.CloudStorage.setItem('kh6_res',res);tg.CloudStorage.setItem('kh6_grid',JSON.stringify(S.grid));tg.CloudStorage.setItem('kh6_seeds',JSON.stringify(S.rareSeeds));}}
function load(){
  if(tg?.CloudStorage){tg.CloudStorage.getItems(['kh6_res','kh6_grid','kh6_seeds'],(err,vals)=>{if(err||!vals?.kh6_res){loadLocal();return;}try{const r=JSON.parse(vals.kh6_res||'{}');Object.assign(S,r);if(r.seasonIdx!==undefined){seasonIdx=r.seasonIdx;season=SEASONS[seasonIdx];}if(vals.kh6_grid)S.grid=JSON.parse(vals.kh6_grid);if(vals.kh6_seeds)S.rareSeeds=JSON.parse(vals.kh6_seeds);notify('☁️ Прогрес з хмари!');}catch(e){loadLocal();}renderRes();renderBuild();});}else loadLocal();}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem('kh6')||'null');if(d){Object.assign(S,d);if(d.seasonIdx!==undefined){seasonIdx=d.seasonIdx;season=SEASONS[seasonIdx];}}}catch(e){}}

// ═══ INIT ═══
// Re-run resize after fonts/layout settle
window.addEventListener('load',()=>{resize();});
document.addEventListener('touchstart',unlockAudio,{once:true});
document.addEventListener('click',unlockAudio,{once:true});
load();
setTimeout(()=>{renderRes();renderBuild();},tg?.CloudStorage?600:0);
loop();
setInterval(save,10000);
</script>
